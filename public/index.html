<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="budget-live" content="1">
<meta name="theme-color" content="#34507A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الميزانية">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon-v3.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ميزانية العائلة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, bottom nav with a center add button, bottom sheet for entries */
:root{
  --bg:#F3F4F6;--surface:#FFFFFF;--surface-2:#ECEEF2;--line:#E2E5EB;--fg:#1D2433;--muted:#5D6576;
  --accent:#3C5A86;--on-accent:#FFFFFF;--accent-soft:#E7EDF6;--accent-soft-fg:#2C4468;
  --l-ess:#4E6FA3;--l-imp:#8A7BB8;--l-flex:#D9896A;
  --hero:#34507A;--hero-2:#46668F;--hero-fg:#FFFFFF;--hero-sub:#D7E0EE;--hero-warn:#A85B3B;--hero-warn-2:#BF6E4C;--hero-warn-sub:#FBE3D7;
  --warn-bg:#FBF0E2;--warn-fg:#87501C;--danger:#B4434B;--danger-bg:#F9E7E8;--backdrop:rgba(20,26,40,.42);
  --pos:#3D7F66;--pos-soft:#E3F1EB;--pos-soft-fg:#2C5E4B;
  --c-house:#D9896A;--c-house-soft:#FAEBE4;--c-house-fg:#8E4A2F;
  --c-goal:#D2A44A;--act-exp-bg:#C9724F;--act-exp-fg:#FFFFFF;--c-goal-soft:#F8F0DC;--c-goal-fg:#6E5420;--c-week:#5E9C84;
  --c-exp:#1F8762;--c-cons:#4B72B0;--c-none:#C6613A;--band-safe:rgba(60,90,134,.09);--band-low:rgba(217,137,106,.13);--grid:#E6E9EE;--env-flap:#D8DDE6;
  --shadow:0 1px 2px rgba(25,35,55,.04),0 6px 18px rgba(25,35,55,.05);
  --font-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --font-num:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151C;--surface:#1A1F29;--surface-2:#242A36;--line:#2B3240;--fg:#E7EAF0;--muted:#9BA3B3;
  --accent:#8EA9D3;--on-accent:#111827;--accent-soft:#25324A;--accent-soft-fg:#CCD9EE;
  --l-ess:#8EA9D3;--l-imp:#B3A7D9;--l-flex:#E4A086;
  --hero:#2A3E5E;--hero-2:#34507A;--hero-fg:#FFFFFF;--hero-sub:#C8D4E8;--hero-warn:#7A4029;--hero-warn-2:#8E4B31;--hero-warn-sub:#F6D6C6;
  --warn-bg:#352A1C;--warn-fg:#F0C892;--danger:#E8848B;--danger-bg:#3A2125;--backdrop:rgba(0,0,0,.6);
  --pos:#7CC3A6;--pos-soft:#1C3229;--pos-soft-fg:#B9E4D2;
  --c-house:#E4A086;--c-house-soft:#3A2820;--c-house-fg:#F4C9B6;
  --c-goal:#E3BF6E;--act-exp-bg:#E09A7C;--act-exp-fg:#2A140A;--c-goal-soft:#352D19;--c-goal-fg:#F1DBA6;--c-week:#7CC3A6;
  --c-exp:#3FA883;--c-cons:#6A90D0;--c-none:#D47248;--band-safe:rgba(142,169,211,.12);--band-low:rgba(228,160,134,.14);--grid:#2B3240;--env-flap:#323A4A;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151C;--surface:#1A1F29;--surface-2:#242A36;--line:#2B3240;--fg:#E7EAF0;--muted:#9BA3B3;
  --accent:#8EA9D3;--on-accent:#111827;--accent-soft:#25324A;--accent-soft-fg:#CCD9EE;
  --l-ess:#8EA9D3;--l-imp:#B3A7D9;--l-flex:#E4A086;
  --hero:#2A3E5E;--hero-2:#34507A;--hero-fg:#FFFFFF;--hero-sub:#C8D4E8;--hero-warn:#7A4029;--hero-warn-2:#8E4B31;--hero-warn-sub:#F6D6C6;
  --warn-bg:#352A1C;--warn-fg:#F0C892;--danger:#E8848B;--danger-bg:#3A2125;--backdrop:rgba(0,0,0,.6);
  --pos:#7CC3A6;--pos-soft:#1C3229;--pos-soft-fg:#B9E4D2;
  --c-house:#E4A086;--c-house-soft:#3A2820;--c-house-fg:#F4C9B6;
  --c-goal:#E3BF6E;--act-exp-bg:#E09A7C;--act-exp-fg:#2A140A;--c-goal-soft:#352D19;--c-goal-fg:#F1DBA6;--c-week:#7CC3A6;
  --c-exp:#3FA883;--c-cons:#6A90D0;--c-none:#D47248;--band-safe:rgba(142,169,211,.12);--band-low:rgba(228,160,134,.14);--grid:#2B3240;--env-flap:#323A4A;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(112px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:14px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .eyebrow{font-size:13px;color:var(--muted)}
.top h1{font-family:var(--font-num);font-size:22px;font-weight:600}
.top-end{display:flex;align-items:center;gap:8px}
.avatars{display:flex}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;border:2px solid var(--bg);flex-shrink:0}
.av.a0{background:var(--accent);color:var(--on-accent)}
.av.a1{background:var(--accent-soft);color:var(--accent-soft-fg)}
.avatars .av+.av{margin-inline-start:-10px}
.gear{width:44px;height:44px;border-radius:50%;border:none;background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gear[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:15px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.top-align{align-items:flex-start}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 4px 0}
.section-title h2{font-size:17px;font-family:var(--font-num);font-weight:600}

.hero{background:var(--hero);color:var(--hero-fg);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero.warn{background:var(--hero-warn)}
.hero .sub{color:var(--hero-sub);font-size:13px}
.hero.warn .sub{color:var(--hero-warn-sub)}
.hero .big{font-family:var(--font-num);font-size:34px;font-weight:600;line-height:1.2}
.hero .cur{font-size:14px;font-weight:400}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.cov{display:flex;align-items:baseline;gap:8px}
.cov .num{font-size:26px;font-weight:600}
.gauge{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.16)}
.gauge .zone{position:absolute;inset-block:0;background:rgba(255,255,255,.2);border-radius:999px}
.gauge .fill{position:absolute;inset-block:2px;inset-inline-start:2px;background:#FFFFFF;border-radius:999px;max-width:calc(100% - 4px)}
.legend{display:flex;justify-content:space-between;font-size:11px}
.hero .runway{border-top:1px solid rgba(255,255,255,.18);padding-top:10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}

.banner{border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.banner svg{flex-shrink:0;margin-top:3px}
.banner b{display:block;font-size:14px}
.banner p{font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--warn-fg)}
.banner.info{background:var(--accent-soft);color:var(--accent-soft-fg)}
.banner.danger{background:var(--danger-bg);color:var(--danger)}

.layer{display:flex;flex-direction:column;gap:6px}
.lname{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.bar{height:8px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden}
.bar>div{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.tag{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.tag.ok{background:var(--pos-soft);color:var(--pos-soft-fg)}
.tag.bad{background:var(--danger-bg);color:var(--danger)}
.locked{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13px}
.locked span{display:flex;align-items:center;gap:8px}

.salary .amount{font-family:var(--font-num);font-size:18px;font-weight:600}
.over{color:var(--danger);font-weight:600}

.btn{min-height:48px;border-radius:14px;border:none;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;padding:0 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{min-height:44px;font-size:14px;padding:0 14px}
.btn.danger{background:var(--danger);color:#FFFFFF}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.link-btn{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;min-height:40px;padding:0 8px;border-radius:10px;cursor:pointer}
.link-btn:hover{background:var(--surface-2)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

.txlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tx{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.tx .av{width:30px;height:30px;font-size:12px;border:none}
.tx .av.sys{background:var(--surface-2);color:var(--muted)}
.tx .body{flex:1;min-width:0;display:flex;flex-direction:column}
.tx .title{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.tx .meta{font-size:12px;color:var(--muted)}
.tx .amt{font-size:14px;white-space:nowrap}
.tx.pos .amt{color:var(--pos);font-weight:600}
.tx.sys{background:transparent;border:1px dashed var(--line)}
.tx.sys .title{color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.3;cursor:default}
.month-head{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 0;font-size:13px;gap:8px;flex-wrap:wrap}
.month-head b{font-size:15px}

.sim{border:1px dashed var(--line);background:transparent}

.alloc{display:flex;flex-direction:column;gap:6px}
.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bucket{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bucket span:first-child{font-size:12px;color:var(--muted)}
.bucket .num{font-size:16px;font-weight:600}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
td.num{font-size:13px;text-align:right}
.tx .amt,.tip .num,td.num{direction:ltr;unicode-bidi:isolate}

.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.field input,.field select,.cat-item input,.add-cat input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:15px;width:100%;min-width:0}
.field input.num{font-family:var(--font-num)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.hint.bad{color:var(--danger);font-weight:600}
.big-line{display:flex;align-items:baseline;gap:6px}
.big-line .num{font-size:30px;font-weight:600}

.cat-group{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.cat-group+.cat-group{border-top:1px solid var(--line);padding-top:14px}
.cat-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cat-item{display:flex;align-items:center;gap:6px}
.cat-item input{flex:1;height:44px}
.add-cat{display:flex;gap:8px}
.add-cat input{flex:1;height:44px;background:transparent;border-style:dashed}
.add-cat .btn{flex-shrink:0}

/* plan */
.breakdown{display:flex;flex-direction:column;gap:2px}
.breakdown .row{min-height:30px;font-size:14px}
.breakdown .row.total{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:600}
.need-big{display:flex;align-items:baseline;gap:6px}
.need-big .num{font-size:32px;font-weight:600;line-height:1.2}
.dry{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dry li{display:flex;justify-content:space-between;gap:10px;font-size:14px;align-items:baseline}
.dry li b{font-family:var(--font-num);font-weight:600;white-space:nowrap}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.chart-legend span{display:flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top-width:2.5px;border-top-color:currentColor;display:inline-block}
.sw.exp{border-top-style:solid;color:var(--c-exp)}
.sw.cons{border-top-style:dashed;color:var(--c-cons)}
.sw.none{border-top-style:dotted;color:var(--c-none);border-top-width:3px}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln.exp{stroke:var(--c-exp)}
.ln.cons{stroke:var(--c-cons);stroke-dasharray:6 4}
.ln.none{stroke:var(--c-none);stroke-dasharray:1.5 4;stroke-width:2.5}
.ax{fill:var(--muted);font-size:10px;font-family:var(--font-num)}
.endlab{font-size:10px;font-family:var(--font-num);fill:var(--fg)}
.gridl{stroke:var(--grid);stroke-width:1}
.band-safe{fill:var(--band-safe)}
.band-low{fill:var(--band-low)}
.band-lab{font-size:9px;fill:var(--muted);font-family:var(--font-body)}
.cross{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;top:4px;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;pointer-events:none;min-width:130px;z-index:2;line-height:1.6}
.tip .t-row{display:flex;justify-content:space-between;gap:12px}
.tip .t-row i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:6px}
details.more summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;min-height:40px;display:flex;align-items:center}
details.adder{border:1px dashed var(--line);border-radius:14px;padding:0 12px}
details.adder[open]{padding-bottom:12px}
details.adder summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;min-height:48px;display:flex;align-items:center;list-style:none}
details.adder summary::-webkit-details-marker{display:none}
.adder-body{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none;padding-top:0}
.item .name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.item .meta{font-size:12px;color:var(--muted)}
.item .amt{font-family:var(--font-num);font-weight:600;white-space:nowrap}
.item-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.empty{font-size:13px;color:var(--muted);padding:4px 0}

/* envelopes */
.total{display:flex;flex-direction:column;gap:10px}
.total .big-line .num{font-size:30px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.stack>span{display:block;height:100%}
.tot-rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tot-rows div{display:flex;flex-direction:column;gap:2px;min-width:0}
.tot-rows .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tot-rows .num{font-size:15px;font-weight:600}
.cats{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.cats li{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding-inline-start:18px}
.cats li b{color:var(--fg);font-weight:500;font-family:var(--font-num)}
.envs{background:var(--surface);border-radius:18px;padding:4px 16px;display:flex;flex-direction:column}
.env{display:flex;gap:12px;align-items:center;padding-block:14px}
.env+.env{border-top:1px solid var(--line)}
.env .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent-soft-fg)}
.env .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.env .body b{font-size:15px;font-weight:600}
.env .body span{font-size:12px;color:var(--muted);line-height:1.5}
.env .amt{font-family:var(--font-num);font-size:19px;font-weight:600;white-space:nowrap}
.env .amt small{font-size:12px;font-weight:400;color:var(--muted);margin-inline-start:3px}
.env.house .ico{background:var(--c-house-soft);color:var(--c-house-fg)}
.env.goal .ico{background:var(--c-goal-soft);color:var(--c-goal-fg)}
.env.warn .ico{background:var(--warn-bg);color:var(--warn-fg)}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wk{border-radius:12px;padding:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;min-width:0;border:2px solid transparent}
.wk.now{border-color:var(--c-week);background:var(--surface)}
.wk.past{opacity:.75}
.wk .lab{font-size:11px;color:var(--muted)}
.wk .v{font-family:var(--font-num);font-size:14px;font-weight:600}
.wk .bar{height:5px}
.week-big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.week-big .num{font-size:30px;font-weight:600;line-height:1.2}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .mark{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-num);font-size:13px;color:var(--muted)}
.step.done .mark{background:var(--pos);border-color:var(--pos);color:var(--surface)}
.step .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.step .txt b{font-size:14px}
.step .txt p{font-size:13px;color:var(--muted)}
.step.done .txt b{color:var(--muted);text-decoration:line-through}
.rules{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.rules li::marker{color:var(--accent);font-family:var(--font-num);font-weight:600}
.count-res{display:flex;flex-direction:column;gap:8px}

const uid=()=>'t'+Date.now().toString(36)+(uidN++);
const ym=m=>{const [y,mm]=m.split('-').map(Number);return {y,mm};};
const mkey=(y,mm)=>y+'-'+String(mm).padStart(2,'0');
const monthLabel=m=>{const {y,mm}=ym(m);return MONTHS[mm-1]+' '+y;};
const monthShort=m=>MONTHS[ym(m).mm-1];
const nextMonth=m=>{let {y,mm}=ym(m);mm++;if(mm>12){mm=1;y++;}return mkey(y,mm);};
const addMonths=(m,n)=>{let {y,mm}=ym(m);const t=y*12+(mm-1)+n;return mkey(Math.floor(t/12),t%12+1);};
const monthsBetween=(a,b)=>{const A=ym(a),B=ym(b);return (B.y-A.y)*12+(B.mm-A.mm);};
const thisMonth=()=>{const d=new Date();return mkey(d.getFullYear(),d.getMonth()+1);};
const inMonths=n=>n<=0?'هذا الشهر':n===1?'الشهر الجاي':n===2?'بعد شهرين':n<=10?'بعد '+n+' شهور':'بعد '+n+' شهر';
function findCat(id){const c=S.settings.cats;for(const l in c){const x=c[l].find(i=>i.id===id);if(x)return {layer:l,name:x.name,item:x};}return null;}
// Household share = the monthly amounts of all items; an item tied to a finished debt no longer counts.
function recomputeBudgets(s){
  const left=id=>{const d=s.debts.find(x=>x.id===id);if(!d)return 0;let p=0;for(const t of s.tx)if(t.debtId===id&&(t.t==='exp'||t.t==='debtx'))p+=t.amt;return d.amount-p;};
  const sum=l=>(s.settings.cats[l]||[]).reduce((a,c)=>a+((c.debtId&&left(c.debtId)<=0.5)?0:(Number(c.amt)||0)),0);
  s.settings.budgets={ess:sum('ess'),imp:0,flex:sum('flex')};
}
function catName(t){const f=findCat(t.cat);return f?f.name:(t.cname||'بند محذوف');}
function isDebtCat(id){if(id==='debt')return true;const f=findCat(id);return !!(f&&/دين|ديون|قرض|أقساط|قسط/.test(f.name));}
const layerName=id=>(LAYERS.find(l=>l.id===id)||{name:''}).name;
const bucketName=id=>(BUCKETS.find(b=>b[0]===id)||['',''])[1];
const byId=(arr,id)=>arr.find(x=>x.id===id);

/* ---------- engine: reservoir and monthly share ---------- */
function fullShare(s){return sum3(s.settings.budgets);}
function reservoir(s){let r=s.opening;for(const t of s.tx){if(t.t==='inc'||t.t==='close'||t.t==='adj')r+=t.amt;else if(t.t==='salary'||t.t==='dist'||t.t==='planned'||t.t==='debtx'||t.t==='emerg')r-=t.amt;}return r;}
function modeFor(s,res){
  const fs=fullShare(s);if(fs<=0)return 'safe';
  const c=res/fs, st=s.settings;
  if(res>st.tMax*fs)return 'surplus';
  return c>=st.brake?'safe':'austerity';
}
function plannedFor(s,mode){
  const b=s.settings.budgets;
  if(mode==='austerity')return {ess:b.ess,imp:b.imp,flex:0};
  return {ess:b.ess,imp:b.imp,flex:b.flex};
}
function monthMode(s,m){const t=s.tx.find(x=>x.t==='salary'&&x.m===m);return t?t.mode:modeFor(s,reservoir(s));}
function payShare(s){
  const res=reservoir(s), mode=modeFor(s,res), need=sum3(plannedFor(s,mode));
  const amt=Math.max(0,Math.min(need,res));
  s.tx.push({id:'sal-'+s.month,t:'salary',amt,mode,m:s.month,d:1});
  return {amt,need,mode};
}
function stats(s,m){
  const mode=monthMode(s,m), planned=plannedFor(s,mode);
  const spent={ess:0,imp:0,flex:0};let paid=0,inc=0;
  for(const t of s.tx){if(t.m!==m)continue;
    if(t.t==='exp'&&spent[t.layer]!=null)spent[t.layer]+=t.amt;
    else if(t.t==='salary')paid+=t.amt;
    else if(t.t==='inc')inc+=t.amt;}
  const spentTotal=sum3(spent);
  return {mode,planned,spent,spentTotal,paid,inc,left:paid-spentTotal};
}
function closeMonth(s){
  recomputeBudgets(s);
  const st=stats(s,s.month), old=s.month;
  s.tx.push({id:'close-'+old,t:'close',amt:st.left,m:old,d:31});
  s.month=nextMonth(old);
  const pay=payShare(s);
  autoMonth(s);
  return {old,left:st.left,pay};
}
// Start of a month: record the fixed bills, and move anything above the reserve cap to the goals envelope.
function autoMonth(s){
  const catOf=id=>{for(const l in s.settings.cats){const c=s.settings.cats[l].find(x=>x.id===id);if(c)return {layer:l,name:c.name};}return null;};
  const debtOpen=id=>{const d=s.debts.find(x=>x.id===id);if(!d)return false;let p=0;for(const t of s.tx)if(t.debtId===id&&(t.t==='exp'||t.t==='debtx'))p+=t.amt;return d.amount-p>0.5;};
  recomputeBudgets(s);
  for(const l of ['ess','flex'])for(const f of s.settings.cats[l]||[]){
    if(!f.fixed||!(f.amt>0)||(f.debtId&&!debtOpen(f.debtId)))continue;
    const id='fx-'+f.id+'-'+s.month;if(s.tx.some(t=>t.id===id||(t.m===s.month&&t.t==='exp'&&t.cat===f.id&&(t.fixedId||t.auto))))continue;
    const t={id,t:'exp',amt:f.amt,cat:f.id,cname:f.name,layer:l,fixedId:f.id,who:null,note:'',m:s.month,d:1,auto:true};
    if(f.debtId)t.debtId=f.debtId;s.tx.push(t);
  }
  const fs=fullShare(s), cap=s.settings.tMax*fs, res=reservoir(s), id='dist-'+s.month;
  if(fs>0&&res>cap+0.5&&!s.tx.some(t=>t.id===id))s.tx.push({id,t:'dist',amt:Math.round(res-cap),to:'goals',m:s.month,d:1,auto:true});
}
function goalsPool(){let g=0;for(const t of S.tx){if(t.t==='dist'&&(t.to==='goals'||t.to==='proj'))g+=t.amt;else if(t.t==='goalspend')g-=t.amt;else if(t.t==='gadj')g+=t.amt;}return g;}
function buckets(s){const b={goals:0,fun:0};for(const t of s.tx){if(t.t==='dist'){if(t.to==='fun')b.fun+=t.amt;else b.goals+=t.amt;}else if(t.t==='goalspend')b.goals-=t.amt;else if(t.t==='gadj')b.goals+=t.amt;}return b;}
const bucketsTotal=b=>b.goals+b.fun;

/* ---------- envelopes ---------- */
const weekOf=d=>Math.min(4,Math.max(1,Math.ceil((d||1)/7)));
const todayDay=()=>new Date().getDate();
function fixedActive(f){if(!f.debtId)return true;const d=byId(S.debts,f.debtId);return !!d&&debtLeft(d)>0;}
const allItems=()=>['ess','flex'].flatMap(l=>(S.settings.cats[l]||[]).map(c=>Object.assign({layer:l},c)));
const activeFixed=()=>allItems().filter(c=>c.fixed&&c.amt>0&&fixedActive(c)).map(c=>({id:c.id,cat:c.id,amt:c.amt,debtId:c.debtId,name:c.name}));
function fixedDone(f){let sp=0;for(const t of S.tx){if(t.t!=='exp'||t.m!==S.month||t.cat!==f.cat)continue;if(t.fixedId||t.auto)return true;sp+=t.amt;}return sp>=f.amt-0.5;}
function weekInfo(){
  const st=stats(S,S.month), af=activeFixed(), fx=new Set(af.map(f=>f.cat));
  const fixedTotal=af.reduce((a,f)=>a+f.amt,0);
  const varBudget=Math.max(0,st.paid-fixedTotal), weekly=varBudget/4, cw=weekOf(todayDay());
  const spent=[0,0,0,0];
  for(const t of S.tx){if(t.m!==S.month||t.t!=='exp'||fx.has(t.cat))continue;spent[weekOf(t.d)-1]+=t.amt;}
  const before=spent.slice(0,cw-1).reduce((a,b)=>a+b,0), carry=weekly*(cw-1)-before;
  return {st,weekly,spent,cw,carry,left:weekly+carry-spent[cw-1],varBudget,fixedTotal,unpaid:af.filter(f=>!fixedDone(f))};
}
function wealth(){const res=reservoir(S), house=houseCash(), b=buckets(S), goals=bucketsTotal(b);return {res,house,goals,b,total:res+house+goals};}
function totalCard(){
  const w=wealth(), parts=[['house','ظرف البيت',Math.max(0,w.house),'var(--c-house)'],['res','الاحتياطي',Math.max(0,w.res),'var(--accent)'],['goal','الأهداف',Math.max(0,w.goals),'var(--c-goal)']];
  const sum=parts.reduce((a,x)=>a+x[2],0)||1;
  return `<section class="card total"><div class="row"><h2>كل فلوسكم الحين</h2><button type="button" class="link-btn" data-tab-go="env">الظروف</button></div>
    <div class="big-line"><span class="num">${fmt(w.total)}</span><span class="muted">د.ت</span></div>
    <div class="stack" role="img" aria-label="توزيع الفلوس على الظروف">${parts.filter(x=>x[2]>0).map(x=>`<span style="width:${x[2]/sum*100}%;background:${x[3]}"></span>`).join('')}</div>
    <div class="tot-rows">${parts.map((x,i)=>`<div><span class="lab"><i class="dot" style="background:${x[3]}"></i>${x[1]}</span><span class="num ${i===0&&w.house<0?'over':''}">${fmt(i===0?w.house:x[2])}</span></div>`).join('')}</div>
  </section>`;
}
function houseCash(){const st=stats(S,S.month);return st.paid-st.spentTotal;}
function ritual(){return S.ritual[S.month]||{};}
function surplusOf(s){return reservoir(s)-s.settings.tMax*fullShare(s);}
function avgSpend(s){
  const closed=[...new Set(s.tx.filter(t=>t.t==='close').map(t=>t.m))].slice(-3);
  if(!closed.length)return null;
  const tot=closed.reduce((a,m)=>a+stats(s,m).spentTotal,0);
  return {avg:tot/closed.length,n:closed.length};
}

/* ---------- engine: planning ---------- */
const planStart=p=>mkey(p.yy,p.mm);
function planPaid(p,occ){return S.tx.some(t=>t.t==='planned'&&t.planId===p.id&&t.occ===occ);}
function planNext(p){
  if(!p.yearly){const occ=planStart(p);if(planPaid(p,occ))return null;return {occ,overdue:occ<S.month};}
  const cy=ym(S.month).y;let occ=mkey(cy,p.mm);
  if(occ<S.month)occ=mkey(cy+1,p.mm);
  if(occ<planStart(p))occ=planStart(p);
  if(planPaid(p,occ))occ=mkey(ym(occ).y+1,p.mm);
  return {occ,overdue:false};
}
function dueNow(){return S.plans.map(p=>({p,n:planNext(p)})).filter(x=>x.n&&x.n.occ<=S.month);}
function plannedOutAt(K){
  let s=0;
  for(const p of S.plans){
    if(p.yearly){if(ym(K).mm===p.mm&&K>=planStart(p)&&!planPaid(p,K))s+=p.amt;}
    else if(planStart(p)===K&&!planPaid(p,K))s+=p.amt;
  }
  return s;
}
function provision(){
  let yearly=0,once=0;const end=addMonths(S.month,11);
  for(const p of S.plans){
    if(p.yearly)yearly+=p.amt/12;
    else{const n=planNext(p);if(n&&n.occ<=end)once+=p.amt/12;}
  }
  return {yearly,once,total:yearly+once};
}
function goalAlloc(){
  let avail=Math.max(0,goalsPool());const m={};
  for(const g of S.goals){if(g.done)continue;const a=Math.max(0,Math.min(g.target,avail));m[g.id]=a;avail-=a;}
  return {m,free:Math.max(0,avail)};
}
function goalsMonthlyNeed(){
  const al=goalAlloc().m;let need=0;
  for(const g of S.goals){if(g.done||!g.yy)continue;const left=Math.max(0,g.target-(al[g.id]||0));if(!left)continue;need+=left/Math.max(1,monthsBetween(S.month,mkey(g.yy,g.mm)));}
  return need;
}
function debtPaid(d){let p=0;for(const t of S.tx)if(t.debtId===d.id&&(t.t==='exp'||t.t==='debtx'))p+=t.amt;return p;}
const debtLeft=d=>Math.max(0,d.amount-debtPaid(d));
function incomeHistory(){
  const months=[...new Set(S.tx.map(t=>t.m))].sort().slice(-6);
  const tot=S.tx.filter(t=>t.t==='inc'&&months.includes(t.m)).reduce((a,t)=>a+t.amt,0);
  return {avg:months.length?tot/months.length:0,n:months.length};
}
function expectedIncome(){return S.settings.expectedIncome>0?S.settings.expectedIncome:Math.round(incomeHistory().avg);}

// Month-by-month projection using the same rules the app applies: share by mode, planned outflows, income, surplus distributed above the max target.
function simulate(income,n){
  const fs=fullShare(S), st=S.settings;let res=reservoir(S);
  res-=dueNow().reduce((a,x)=>a+x.p.amt,0);
  const pts=[{m:S.month,res,mode:modeFor(S,res),short:0,out:0,goalsIn:0}];let goalsIn=0,m=S.month;
  for(let k=1;k<=n;k++){
    m=nextMonth(m);
    const mode=modeFor(S,res), need=sum3(plannedFor(S,mode)), paid=Math.max(0,Math.min(need,res));
    res-=paid;const out=plannedOutAt(m);res-=out;res+=income;
    const cap=st.tMax*fs;if(fs>0&&res>cap){goalsIn+=(res-cap)*st.split.goals/100;res=cap;}
    pts.push({m,res,mode,short:need-paid,out,goalsIn});
  }
  return pts;
}
function dryRun(){
  const pts=simulate(0,36);
  const firstShort=pts.find((p,i)=>i>0&&p.short>0.5);
  const firstAust=pts.find((p,i)=>i>0&&p.mode==='austerity');
  const lastFull=firstAust?addMonths(firstAust.m,-1):firstShort?addMonths(firstShort.m,-1):null;
  return {firstShort,firstAust,lastFull};
}

function emptyState(prev){return {settings:prev?prev.settings:defaultSettings(),opening:0,month:thisMonth(),tx:[],isSample:false,plans:[],goals:[],debts:[],
  fixed:((prev&&prev.fixed)||[]).map(f=>({id:f.id,cat:f.cat,amt:f.amt})),ritual:{},lastCount:null};}

/* ---------- storage ---------- */
const LIVE=!!document.querySelector('meta[name="budget-live"]');
const LKEY='khazzan-live-v1', API='/api/state';
const CFG_KEYS=['settings','opening','month','plans','goals','debts','fixed','ritual','lastCount','started'];
let base=null;   // last state confirmed by the server: {rev, ids:[...], cfg:{key:json}}
function normalize(s){
  if(!s||!s.settings||!Array.isArray(s.tx)||!s.month)return null;
  if(!s.settings.cats||!Array.isArray(s.plans)){if(s.isSample)return null;s.settings.cats=s.settings.cats||DEFAULT_CATS();s.plans=s.plans||[];s.goals=s.goals||[];s.debts=s.debts||[];}
  if(!Array.isArray(s.goals))s.goals=[];if(!Array.isArray(s.debts))s.debts=[];
  if(s.settings.expectedIncome==null)s.settings.expectedIncome=0;
  if(s.settings.brake==null){s.settings.brake=1.5;delete s.settings.tMin;}
  if(!s.settings.split||s.settings.split.proj!=null)s.settings.split={goals:90,fun:10};
  if(!Array.isArray(s.fixed)){if(s.isSample)return null;s.fixed=[];}
  if(!s.ritual)s.ritual={};
  if(s.lastCount===undefined)s.lastCount=null;
  if(!s.settings.itemBudgets){
    const c0=s.settings.cats, b0=s.settings.budgets||{ess:0,imp:0,flex:0};
    if(c0.imp&&c0.imp.length){c0.ess=c0.ess.concat(c0.imp);c0.imp=[];}
    const all=[...c0.ess,...(c0.flex||[])];
    for(const c of all){if(c.amt==null)c.amt=0;if(c.fixed==null)c.fixed=false;}
    for(const f of (s.fixed||[])){const c=all.find(x=>x.id===f.cat);if(c){c.amt+=f.amt;c.fixed=true;if(f.debtId)c.debtId=f.debtId;}}
    const want={ess:(b0.ess||0)+(b0.imp||0),flex:b0.flex||0};
    for(const l of ['ess','flex']){const items=c0[l]||[];const sum=items.reduce((a,c)=>a+c.amt,0);if(want[l]>sum){const t=items.find(c=>!c.fixed&&(c.id==='food'||c.id==='out'))||items.find(c=>!c.fixed)||items[0];if(t)t.amt+=want[l]-sum;}}
    s.fixed=[];s.settings.itemBudgets=true;
  }
  const b=s.settings.budgets;if(b.imp>0){b.ess+=b.imp;b.imp=0;}
  const c=s.settings.cats;if(!c.imp)c.imp=[];if(c.imp.length){c.ess=c.ess.concat(c.imp);c.imp=[];}
  for(const t of s.tx)if(t.layer==='imp')t.layer='ess';
  recomputeBudgets(s);
  return s;
}
function liveEmpty(){const e=emptyState(null);e.started=false;return e;}
function load(){
  try{const raw=localStorage.getItem(LIVE?LKEY:KEY);if(!raw)return null;let o=JSON.parse(raw);
    if(LIVE){if(!o||!o.S)return null;base=o.base||null;o=o.S;}
    return normalize(o);}catch(e){return null;}
}
function persistLocal(){try{localStorage.setItem(LIVE?LKEY:KEY,JSON.stringify(LIVE?{S,base}:S));}catch(e){}}
function save(){recomputeBudgets(S);persistLocal();if(LIVE)schedulePush();}

const SYNC_LABEL={ok:'محفوظ عند الكل',pending:'يحفظ…',saving:'يحفظ…',offline:'بدون اتصال: محفوظ على الجهاز',auth:'لازم تسجيل دخول'};
let syncState='ok', pushing=false, pushAgain=false, pushTimer=null, pulling=false, pendingRender=false;
const getPass=()=>{try{return localStorage.getItem('kz-pass')||'';}catch(e){return '';}};
const setPass=v=>{try{if(v)localStorage.setItem('kz-pass',v);else localStorage.removeItem('kz-pass');}catch(e){}};

const setMe=v=>{try{localStorage.setItem('kz-me',String(v));}catch(e){}};
function setSync(st){syncState=st;const el=document.getElementById('syncDot');if(el){el.dataset.s=st;el.textContent=SYNC_LABEL[st];}}
async function api(method,body,pass){
  const r=await fetch(API,{method,headers:{'content-type':'application/json',authorization:'Bearer '+(pass||getPass())},body:body?JSON.stringify(body):undefined,cache:'no-store'});

const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
function snapshot(doc){const cfg={};for(const k of CFG_KEYS)cfg[k]=JSON.stringify((doc.cfg||{})[k]??null);return {rev:doc.rev||0,ids:(doc.tx||[]).map(t=>t.id),cfg};}
function diff(){
  const b=new Set(base.ids), cur=new Set(S.tx.map(t=>t.id));
  const add=S.tx.filter(t=>!b.has(t.id)), del=base.ids.filter(id=>!cur.has(id)), cfg={};
  for(const k of CFG_KEYS){const v=JSON.stringify(S[k]??null);if(v!==base.cfg[k])cfg[k]=S[k]??null;}
  return {add,del,cfg,empty:!add.length&&!del.length&&!Object.keys(cfg).length};
}
// Combine the server copy with anything changed on this phone that the server has not seen yet.
function mergeFromServer(doc){
  const hasCfg=doc.cfg&&doc.cfg.settings;
  if(!base){
    if(hasCfg){const n=normalize(Object.assign({},clone(doc.cfg),{tx:clone(doc.tx)}));if(n)S=n;base=snapshot(doc);}
    else base=snapshot({rev:doc.rev||0,tx:doc.tx||[],cfg:{}});
    return;
  }
  if((doc.rev||0)<base.rev)return;   // an older answer that arrived late
  const old=base, oldIds=new Set(old.ids), cur=new Set(S.tx.map(t=>t.id)), docIds=new Set(doc.tx.map(t=>t.id));
  const deletedHere=new Set(old.ids.filter(id=>!cur.has(id)));
  const newHere=S.tx.filter(t=>!oldIds.has(t.id)&&!docIds.has(t.id));
  const next={tx:clone(doc.tx).filter(t=>!deletedHere.has(t.id)).concat(newHere)};
  for(const k of CFG_KEYS){const local=JSON.stringify(S[k]??null);next[k]=local!==old.cfg[k]?S[k]:clone((doc.cfg||{})[k]);}
  const n=normalize(next);if(n)S=n;
  base=snapshot(doc);
}
function schedulePush(){if(!LIVE)return;clearTimeout(pushTimer);pushTimer=setTimeout(push,600);setSync('pending');}
async function push(){
  if(!LIVE||!getPass()||!base)return;
  if(pushing){pushAgain=true;return;}
  const d=diff();if(d.empty){setSync('ok');return;}
  pushing=true;setSync('saving');
  try{const doc=await api('POST',{add:d.add,del:d.del,cfg:d.cfg});mergeFromServer(doc);persistLocal();refreshUI();}
  catch(e){pushing=false;if(e.status===401){setSync('auth');showGate();return;}setSync(e.status===409?'saving':'offline');clearTimeout(pushTimer);pushTimer=setTimeout(push,e.status===409?800:15000);return;}
  pushing=false;
  if(pushAgain||!diff().empty){pushAgain=false;push();}else setSync('ok');
}
async function pull(){
  if(!LIVE||!getPass()||pulling||pushing)return;
  pulling=true;
  try{
    const doc=await api('GET');
    if(!base||doc.rev>base.rev){mergeFromServer(doc);persistLocal();refreshUI();}
    catchUp();
    if(!diff().empty)schedulePush();else if(syncState!=='pending')setSync('ok');
  }catch(e){if(e.status===401){setSync('auth');showGate();}else setSync('offline');}
  pulling=false;
}
// Close every month that has ended since the app was last opened.
function catchUp(){
  if(!LIVE||S.started===false)return;
  let n=0;while(S.month<thisMonth()&&n<36){closeMonth(S);n++;}
  if(n){ui.count=null;save();refreshUI(true);toast(n===1?`بدأ شهر ${monthLabel(S.month)}: باقي الشهر الماضي رجع للاحتياطي ونزلت الحصة الجديدة.`:`انقفلت ${n} شهور، والحين ${monthLabel(S.month)}.`);}
}

    return `<div class="count-row off"><span>${rw.label}: ${msg}</span><button type="button" class="btn small ghost" data-action="count-fix" data-key="${rw.key}">${rw.key==='house'&&rw.diff<0?'سجّله مصروف':'اعتمد المعدود'}</button></div>`;}).join('')}
    ${c.tooMuchCash>0?`<p class="hint">الكاش في ظرف الاحتياطي فوق حصة شهر. حطوا ${fmt(c.tooMuchCash)} في حساب الادخار.</p>`:''}</div>`;
  h+=`<details class="card fold" ${c.rows?'open':''}><summary><h2>عدّ الظروف</h2><span class="small muted">آخر الشهر، دقيقتين</span></summary>
    <div class="fields two">${fld('c-house','كاش ظرف البيت')}${fld('c-rcash','كاش ظرف الاحتياطي')}${fld('c-rbank','حساب الادخار')}${fld('c-goals','الأهداف')}</div>
    <button type="button" class="btn" data-action="count">قارن</button>${results}
    ${S.lastCount?`<p class="hint">آخر عدّ: ${S.lastCount.d} ${monthLabel(S.lastCount.m)}</p>`:''}</details>`;
  // reserve history
  let run=S.opening, rowsH='';
  for(const m of [...months].reverse()){let inc=0,out=0;for(const t of S.tx){if(t.m!==m)continue;if(t.t==='inc'||t.t==='close'||t.t==='adj')inc+=t.amt;else if(['salary','dist','planned','debtx','emerg'].includes(t.t))out+=t.amt;}run+=inc-out;rowsH+=`<tr><td>${monthShort(m)}</td><td class="num">+${fmt(inc)}</td><td class="num">-${fmt(out)}</td><td class="num"><b>${fmt(run)}</b></td></tr>`;}
  h+=`<details class="card fold"><summary><h2>حركة الاحتياطي</h2><span class="small muted">شهر بشهر</span></summary><div class="table-wrap"><table><thead><tr><th>الشهر</th><th>دخل</th><th>طلع</th><th>الرصيد</th></tr></thead><tbody><tr><td class="muted">البداية</td><td></td><td></td><td class="num">${fmt(S.opening)}</td></tr>${rowsH}</tbody></table></div></details>`;
  return h;
}

/* ---------- future ---------- */
function futureView(){
  const set=S.settings, fs=fullShare(S), hist=incomeHistory(), exp=expectedIncome(), prov=provision(), gNeed=goalsMonthlyNeed();
  const required=fs+prov.total+gNeed, gap=exp-required, d=dryRun();
  let h=header('المستقبل');
  h+=`<section class="card summary">
    <div class="sum-row"><span class="k">لو وقف الدخل</span><span class="v">الحصة الكاملة تكفي حتى <b>${d.lastFull?monthLabel(d.lastFull):'أكثر من 3 سنين'}</b>${d.firstAust?`، وبعدها ترشيد`:''}</span></div>
    <div class="sum-row"><span class="k">الدخل اللي تحتاجونه</span><span class="v"><b class="num">${fmt(required)}</b> بالشهر${exp>0?`، ومتوسطكم <b class="num">${fmt(exp)}</b> ${gap>=0?'<span class="tag ok">يكفي</span>':`<span class="tag warn">ناقص ${fmt(-gap)}</span>`}`:''}</span></div>

  </details>`;
  // upcoming expenses
  const plans=S.plans.map(p=>({p,n:planNext(p)})).filter(x=>x.n).sort((a,b)=>a.n.occ<b.n.occ?-1:1);
  h+=`<section class="card"><div class="row"><h2>مصاريف قادمة</h2><span class="small muted">من الاحتياطي</span></div>

  </section>`;
  // goals
  const al=goalAlloc(), pool=goalsPool(), active=S.goals.filter(g=>!g.done), done=S.goals.filter(g=>g.done);
  const sim=simulate(exp,48);let cum=0;const eta={};
  for(const g of active){cum+=g.target;const need=cum-Math.max(0,pool);if(need<=0){eta[g.id]=S.month;continue;}const hit=sim.find(p=>p.goalsIn>=need);eta[g.id]=hit?hit.m:null;}

        <span class="amt">${fmt(a)}<small class="muted"> / ${fmt(g.target)}</small></span></div>
        <div class="bar"><div style="width:${g.target?Math.min(100,a/g.target*100):0}%;background:var(--c-goal)"></div></div>
        <div class="factions"><button type="button" class="icon-btn" data-action="goal-up" data-id="${g.id}" aria-label="قدّمه" ${i===0?'disabled':''}>${ICON.up}</button><button type="button" class="icon-btn" data-action="goal-down" data-id="${g.id}" aria-label="أخّره" ${i===active.length-1?'disabled':''}>${ICON.down}</button><button type="button" class="icon-btn" data-action="del-goal" data-id="${g.id}" aria-label="حذف">${ICON.trash}</button></div></div>`;}).join(''):'<p class="empty">مثل مقدّم سيارة، تعليم، بيت. تتعبّى بالترتيب من الزايد.</p>'}
    ${done.length?`<p class="hint">تحققت: ${done.map(g=>esc(g.name)).join('، ')}</p>`:''}
    <details class="mini"><summary>تحويل من الاحتياطي للأهداف</summary><div class="add-cat"><input class="num" id="gt-amt" type="number" inputmode="numeric" min="0" step="100" placeholder="المبلغ" aria-label="المبلغ"><button type="button" class="btn small" data-action="goal-transfer">حوّل</button></div></details>
  </section>`;

  const debts=S.debts.map(dd=>({d:dd,left:debtLeft(dd)})).sort((a,b)=>(a.left===0)-(b.left===0)||a.left-b.left);
  h+=`<section class="card"><div class="row"><h2>ديون</h2>${debts.some(x=>x.left>0)?`<span class="small muted">باقي <span class="num">${fmt(debts.reduce((a,x)=>a+x.left,0))}</span></span>`:''}</div>
    ${debts.length?debts.map(({d:dd,left})=>{const m=left>0?Math.ceil(left/Math.max(1,dd.inst)):0;
      return `<div class="fitem col"><div class="frow"><span class="fico debt">${ICON.debt}</span><div class="body"><b>${esc(dd.name)}</b><span>${left>0?`قسط ${fmt(dd.inst)} · يخلص ${monthLabel(addMonths(S.month,m))}`:'خلص. تحرر قسطه من الثابتة.'}</span></div><span class="amt">${fmt(left)}</span></div>
        <div class="bar"><div style="width:${dd.amount?Math.min(100,(dd.amount-left)/dd.amount*100):0}%;background:var(--pos)"></div></div>
        <div class="factions">${left>0?`<button type="button" class="link-btn" data-action="debt-extra" data-id="${dd.id}">قسط إضافي من الاحتياطي</button>`:''}<button type="button" class="icon-btn" data-action="del-debt" data-id="${dd.id}" aria-label="حذف">${ICON.trash}</button></div></div>`;}).join(''):'<p class="empty">ما فيه ديون.</p>'}
  </section>`;
  // one add form
  const t=ui.addType, ny=ym(nextMonth(S.month));

    <p class="form-error" id="a-err" role="alert"></p><button type="button" class="btn" data-action="add-item">إضافة</button></details>`;
  return h;

/* ---------- chart ---------- */
function niceStep(range){const raw=range/4;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function chartSVG(series,fs){
  const st=S.settings, W=360, H=210, ml=40, mr=58, mt=10, mb=24, pw=W-ml-mr, ph=H-mt-mb;
  let lo=0, hi=st.tMax*fs*1.08;
  series.forEach(s=>s.pts.forEach(p=>{lo=Math.min(lo,p.res);hi=Math.max(hi,p.res);}));
  const step=niceStep(hi-lo);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const n=series[0].pts.length-1, x=i=>ml+i*pw/n, y=v=>mt+(hi-v)/(hi-lo)*ph;
  let g='';
  // bands
  const bTop=y(Math.min(hi,st.tMax*fs)), bBot=y(Math.max(lo,st.brake*fs));
  g+=`<rect class="band-safe" x="${ml}" y="${bTop}" width="${pw}" height="${Math.max(0,bBot-bTop)}"/>`;
  g+=`<text class="band-lab" x="${ml+4}" y="${bTop+11}" text-anchor="start">منطقة الأمان</text>`;
  const lTop=y(Math.min(hi,st.brake*fs)), lBot=y(Math.max(lo,0));
  g+=`<rect class="band-low" x="${ml}" y="${lTop}" width="${pw}" height="${Math.max(0,lBot-lTop)}"/>`;
  g+=`<text class="band-lab" x="${ml+4}" y="${lBot-4}" text-anchor="start">ترشيد</text>`;
  // grid + y labels
  for(let v=lo;v<=hi+0.1;v+=step){g+=`<line class="gridl" x1="${ml}" x2="${ml+pw}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${ml-6}" y="${y(v)+3}" text-anchor="end">${fmtK(v)}</text>`;}
  // x labels
  series[0].pts.forEach((p,i)=>{if(i%3===0)g+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${i===0?'الآن':monthShort(p.m)}</text>`;});
  // lines
  series.forEach(s=>{g+=`<path class="ln ${s.cls}" d="${s.pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.res).toFixed(1)).join(' ')}"/>`;});
  // end labels, pushed apart to avoid overlap
  const ends=series.map(s=>({cls:s.cls,v:s.pts[n].res,yy:y(s.pts[n].res)})).sort((a,b)=>a.yy-b.yy);
  for(let i=1;i<ends.length;i++)if(ends[i].yy-ends[i-1].yy<13)ends[i].yy=ends[i-1].yy+13;
  ends.forEach(e=>{g+=`<circle cx="${x(n)}" cy="${y(e.v)}" r="3.5" style="fill:var(--c-${e.cls});stroke:var(--surface);stroke-width:2"/><text class="endlab" x="${x(n)+8}" y="${e.yy+3.5}" text-anchor="start">${fmtK(e.v)}</text>`;});
  g+=`<line id="cross" class="cross" x1="0" x2="0" y1="${mt}" y2="${mt+ph}" visibility="hidden"/>`;
  g+=`<rect id="hit" x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="transparent"/>`;
  chartData={series,ml,pw,n,W};
  return `<svg viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="توقّع رصيد الاحتياطي لـ ${n} شهر بثلاث حالات للإيراد">${g}</svg>`;
}
function bindChart(){
  const wrap=$('#chartWrap');if(!wrap||!chartData)return;
  const svg=wrap.querySelector('svg'), tip=$('#chartTip'), cross=svg.querySelector('#cross');
  const show=ev=>{
    const r=svg.getBoundingClientRect(), sx=(ev.clientX-r.left)/r.width*chartData.W;
    const i=Math.max(0,Math.min(chartData.n,Math.round((sx-chartData.ml)/chartData.pw*chartData.n)));
    const px=chartData.ml+i*chartData.pw/chartData.n;
    cross.setAttribute('x1',px);cross.setAttribute('x2',px);cross.setAttribute('visibility','visible');
    const p0=chartData.series[0].pts[i];
    tip.innerHTML=`<b>${i===0?'الآن':monthLabel(p0.m)}</b>`+chartData.series.map(s=>`<div class="t-row"><span><i style="background:var(--c-${s.cls})"></i>${s.short}</span><span class="num">${fmt(s.pts[i].res)}</span></div>`).join('')+(p0.out?`<div class="t-row"><span>التزامات</span><span class="num">-${fmt(p0.out)}</span></div>`:'');
    tip.hidden=false;
    const left=px/chartData.W*r.width, tw=tip.offsetWidth;
    tip.style.left=Math.max(0,Math.min(r.width-tw,left-tw/2))+'px';
  };
  const hide=()=>{tip.hidden=true;cross.setAttribute('visibility','hidden');};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',hide);
}

    if(!form.emg){
      for(const l of LAYERS){const items=S.settings.cats[l.id];if(!items.length)continue;const frozen=planned[l.id]===0&&S.settings.budgets[l.id]>0;
        h+=`<div><div class="group-label"><i class="dot" style="background:var(--l-${l.id})"></i>${l.name}${frozen?' · موقوف هالشهر':''}</div><div class="chips">${items.map(c=>`<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${form.cat===c.id}">${esc(c.name)}</button>`).join('')}</div></div>`;}
      const open=S.debts.filter(d=>debtLeft(d)>0);
      const fi=form.cat&&findCat(form.cat);if(form.cat&&isDebtCat(form.cat)&&!(fi&&fi.item&&fi.item.debtId)&&open.length)h+=`<div><div class="group-label">أي دين؟</div><div class="chips">${open.map(d=>`<button type="button" class="chip" data-debt="${d.id}" aria-pressed="${form.debt===d.id}">${esc(d.name)}</button>`).join('')}</div></div>`;
    }
    h+=`<button type="button" class="emg-toggle" data-action="toggle-emg" aria-pressed="${form.emg}">${ICON.alert}<span><b>طارئ من الاحتياطي</b><small>علاج أو تصليح ضروري، مو من مصروف الشهر</small></span></button>`;
  }else h=`<div class="banner info">${ICON.info}<p>يروح للاحتياطي مباشرة.</p></div>`;
  $('#catWrap').innerHTML=h;
}
function resetWarn(){form.warned=false;$('#formError').textContent='';$('#txForm button[type=submit]').textContent='حفظ';}
function openSheet(kind){
  form.kind=kind;form.cat=null;form.emg=false;form.debt=null;resetWarn();
  $('#sheetTitle').textContent=kind==='inc'?'دخل فلوس':'صرفت';
  $('#f-amount').value='';$('#f-note').value='';renderSheet();$('#sheet').hidden=false;
  setTimeout(()=>{try{$('#f-amount').focus();}catch(e){}},60);
}
function closeSheet(){$('#sheet').hidden=true;if(pendingRender)setTimeout(()=>refreshUI(),0);}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
const me=()=>LIVE?(getMe()??0):0;
$('#txForm').addEventListener('submit',e=>{
  e.preventDefault();
  const amt=parseAmt($('#f-amount').value), note=$('#f-note').value.trim().slice(0,80);
  if(!amt){$('#formError').textContent='اكتب المبلغ.';return;}
  if(form.kind==='exp'&&form.emg){
    if(amt>reservoir(S)){$('#formError').textContent='المبلغ أكبر من الاحتياطي.';return;}
    S.tx.push({id:uid(),t:'emerg',amt,who:me(),note,m:S.month,d:todayDay()});save();closeSheet();render();toast(`طارئ ${fmt(amt)} من الاحتياطي`);return;
  }
  if(form.kind==='exp'&&!form.cat){$('#formError').textContent='اختر البند.';return;}
  if(form.kind==='exp'&&!form.warned){
    const wi=weekInfo(), fixedCat=activeFixed().some(f=>f.cat===form.cat), hc=houseCash();
    let w='';
    if(amt>hc+0.5)w=`أكثر من اللي باقي في ظرف البيت (${fmt(Math.max(0,hc))}). الفرق بينخصم من الاحتياطي آخر الشهر.`;
    else if(!fixedCat&&amt>wi.left+0.5)w=`أكثر من ظرف هالأسبوع (${fmt(Math.max(0,wi.left))}). بينخصم من الأسابيع الجاية.`;
    if(w){form.warned=true;$('#formError').textContent=w;$('#txForm button[type=submit]').textContent='سجّله برضو';return;}
  }
  const t={id:uid(),t:form.kind,amt,who:me(),note,m:S.month,d:todayDay()};
  if(form.kind==='exp'){const f=findCat(form.cat);t.cat=form.cat;t.cname=f?f.name:'';t.layer=f?f.layer:'ess';if(f&&f.item&&f.item.debtId)t.debtId=f.item.debtId;else if(form.debt&&isDebtCat(form.cat))t.debtId=form.debt;}
  S.tx.push(t);
  let msg=form.kind==='exp'?`تسجّل ${fmt(amt)}`:`${fmt(amt)} للاحتياطي`;
  if(form.kind==='inc'&&S.started!==false){const st=stats(S,S.month), lack=sum3(st.planned)-st.paid;
    if(lack>0.5){const add=Math.min(lack,reservoir(S));if(add>0.5){S.tx.push({id:uid(),t:'salary',amt:add,mode:st.mode,m:S.month,d:todayDay()});msg+=`، ومنه اكتملت حصة الشهر`;}}}
  save();closeSheet();render();toast(msg,()=>{const i=S.tx.indexOf(t);if(i>=0)S.tx.splice(i,1);save();rerenderKeepScroll();});
});
$('#f-amount').addEventListener('input',()=>{if(form.warned)resetWarn();});

/* ---------- actions ---------- */
function removeWithUndo(arr,id){
  const i=arr.findIndex(x=>x.id===id);if(i<0)return;
  const [removed]=arr.splice(i,1);save();rerenderKeepScroll();
  toast(`انحذف «${removed.name}»`,()=>{arr.splice(i,0,removed);save();rerenderKeepScroll();});
}
function addCat(layer){
  const input=$('#new-'+layer);if(!input)return;const name=input.value.trim().slice(0,30);if(!name){input.focus();return;}
  const amt=Math.max(0,Number(val('newamt-'+layer))||0);S.settings.cats[layer].push({id:'c'+uid(),name,amt,fixed:false});save();rerenderKeepScroll();toast(`انضاف «${name}»${amt?` بـ ${fmt(amt)} بالشهر`:''}`);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.newCat){e.preventDefault();addCat(e.target.dataset.newCat);}
});
document.addEventListener('toggle',e=>{const f=e.target.dataset&&e.target.dataset.fold;if(f==='chart')ui.chartOpen=e.target.open;if(f==='add')ui.addOpen=e.target.open;},true);
document.addEventListener('click',e=>{
  const tabBtn=e.target.closest('.nav-btn[data-tab]');if(tabBtn){go(tabBtn.dataset.tab);return;}
  const goBtn=e.target.closest('[data-tab-go]');if(goBtn){go(goBtn.dataset.tabGo);return;}
  const cat=e.target.closest('[data-cat]');if(cat){form.cat=cat.dataset.cat;if(!isDebtCat(form.cat))form.debt=null;if(form.warned)resetWarn();renderSheet();return;}
  const debt=e.target.closest('[data-debt]');if(debt){form.debt=debt.dataset.debt||null;renderSheet();return;}
  const at=e.target.closest('[data-addtype]');if(at){ui.addType=at.dataset.addtype;ui.addOpen=true;rerenderKeepScroll();return;}
  const a=e.target.closest('[data-action]');if(!a||a.disabled)return;
  const act=a.dataset.action, id=a.dataset.id;
  if(act==='add-exp')openSheet('exp');
  else if(act==='add-inc')openSheet('inc');
  else if(act==='close-sheet')closeSheet();
  else if(act==='toggle-emg'){form.emg=!form.emg;form.cat=null;resetWarn();renderSheet();}
  else if(act==='ack'){const r=S.ritual[S.month]||{};r.ack=true;S.ritual[S.month]=r;save();rerenderKeepScroll();}
  else if(act==='topup'){const st=stats(S,S.month), amt=Math.min(sum3(st.planned)-st.paid,reservoir(S));if(amt>0){S.tx.push({id:uid(),t:'salary',amt,mode:st.mode,m:S.month,d:todayDay()});save();rerenderKeepScroll();toast(`اكتملت حصة الشهر (+${fmt(amt)})`);}}
  else if(act==='pay-fixed'){
    const added=weekInfo().unpaid.map(f=>{const c=findCat(f.cat)||{layer:'ess',name:'مصروف ثابت'};const t={id:'fx-'+f.id+'-'+S.month,t:'exp',amt:f.amt,cat:f.cat,cname:c.name,layer:c.layer,fixedId:f.id,who:me(),note:'',m:S.month,d:1};if(f.debtId)t.debtId=f.debtId;return t;}).filter(t=>!S.tx.some(x=>x.id===t.id));
    S.tx.push(...added);save();rerenderKeepScroll();const ids=new Set(added.map(t=>t.id));toast(`تسجّلت الثابتة`,()=>{S.tx=S.tx.filter(t=>!ids.has(t.id));save();rerenderKeepScroll();});
  }
  else if(act==='pay-plan'){const p=byId(S.plans,id);if(!p)return;S.tx.push({id:uid(),t:'planned',amt:p.amt,planId:p.id,pname:p.name,occ:a.dataset.occ,m:S.month,d:todayDay()});save();rerenderKeepScroll();toast(`اندفع «${p.name}» من الاحتياطي`);}
  else if(act==='goal-done'){const g=byId(S.goals,id);if(!g)return;const t={id:uid(),t:'goalspend',amt:g.target,goalId:g.id,m:S.month,d:todayDay()};S.tx.push(t);g.done=true;save();rerenderKeepScroll();toast(`مبروك! تحقق «${g.name}»`,()=>{S.tx=S.tx.filter(x=>x.id!==t.id);g.done=false;save();rerenderKeepScroll();});}
  else if(act==='del'){const i=S.tx.findIndex(t=>t.id===id);if(i<0)return;const [rm]=S.tx.splice(i,1);save();rerenderKeepScroll();toast('انحذفت',()=>{S.tx.splice(i,0,rm);save();rerenderKeepScroll();});}
  else if(act==='count'){
    const v={};['c-house','c-rcash','c-rbank','c-goals'].forEach(k=>{const x=val(k).trim();v[k]=x===''?null:Number(x.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)));});
    const rows=[], w=wealth();
    if(v['c-house']!=null)rows.push({key:'house',label:'ظرف البيت',diff:v['c-house']-w.house});
    if(v['c-rcash']!=null||v['c-rbank']!=null)rows.push({key:'res',label:'الاحتياطي',diff:(v['c-rcash']||0)+(v['c-rbank']||0)-w.res});
    if(v['c-goals']!=null)rows.push({key:'goals',label:'الأهداف',diff:v['c-goals']-w.goals});
    if(!rows.length){toast('اكتبوا رقم واحد على الأقل');return;}
    ui.count={vals:v,rows,tooMuchCash:Math.max(0,(v['c-rcash']||0)-fullShare(S))};S.lastCount={m:S.month,d:todayDay()};save();rerenderKeepScroll();
  }
  else if(act==='count-fix'){
    const k=a.dataset.key, rw=ui.count&&ui.count.rows.find(x=>x.key===k);if(!rw)return;const d=Math.round(rw.diff*100)/100;
    if(k==='house')S.tx.push({id:uid(),t:'exp',amt:-d,cat:'adj',cname:d<0?'مصروف ما تسجّل':'تصحيح عدّ',layer:'flex',who:me(),note:'',m:S.month,d:todayDay()});
    else S.tx.push({id:uid(),t:k==='res'?'adj':'gadj',amt:d,m:S.month,d:todayDay()});
    rw.diff=0;save();rerenderKeepScroll();toast('تعدّلت على المعدود');
  }
  else if(act==='add-item'){
    const name=val('a-name').trim().slice(0,30), amt=parseAmt(val('a-amt')), err=$('#a-err');
    if(!name){err.textContent='اكتب الاسم.';return;}if(!amt){err.textContent='اكتب المبلغ.';return;}
    if(ui.addType==='plan'){const mm=Number(val('a-mm')),yy=Number(val('a-yy')),yearly=$('#a-yearly').checked;if(!yearly&&mkey(yy,mm)<S.month){err.textContent='التاريخ فات.';return;}S.plans.push({id:'p'+uid(),name,amt,mm,yy,yearly});}
    else if(ui.addType==='goal'){const mm=Number(val('a-mm')),yy=Number(val('a-yy'));if(mm&&mkey(yy,mm)<=S.month){err.textContent='اختر موعد بعد هالشهر.';return;}S.goals.push({id:'g'+uid(),name,target:amt,mm:mm||null,yy:mm?yy:null,done:false});}
    else{const inst=parseAmt(val('a-inst'));if(!inst){err.textContent='اكتب القسط الشهري.';return;}const did='d'+uid();S.debts.push({id:did,name,amount:amt,inst});
      S.settings.cats.ess.push({id:'c'+uid(),name:'قسط '+name,amt:inst,fixed:true,debtId:did});}
    ui.addOpen=false;save();rerenderKeepScroll();toast(`انضاف «${name}»`);
  }
  else if(act==='del-plan')removeWithUndo(S.plans,id);
  else if(act==='del-goal')removeWithUndo(S.goals,id);
  else if(act==='del-debt'){S.settings.cats.ess=S.settings.cats.ess.filter(c=>c.debtId!==id);removeWithUndo(S.debts,id);}
  else if(act==='goal-up'||act==='goal-down'){const ac=S.goals.filter(g=>!g.done),i=ac.findIndex(g=>g.id===id),j=act==='goal-up'?i-1:i+1;if(i<0||j<0||j>=ac.length)return;const gi=S.goals.indexOf(ac[i]),gj=S.goals.indexOf(ac[j]);[S.goals[gi],S.goals[gj]]=[S.goals[gj],S.goals[gi]];save();rerenderKeepScroll();}
  else if(act==='goal-transfer'){const amt=parseAmt(val('gt-amt'));if(!amt)return;if(amt>reservoir(S)){toast('أكبر من الاحتياطي');return;}S.tx.push({id:uid(),t:'dist',amt,to:'goals',manual:true,m:S.month,d:todayDay()});save();rerenderKeepScroll();toast(`تحوّل ${fmt(amt)} للأهداف`);}
  else if(act==='debt-extra'){const d=byId(S.debts,id);if(!d)return;const amt=Math.min(d.inst,debtLeft(d));if(amt>reservoir(S)){toast('الاحتياطي ما يكفي');return;}const t={id:uid(),t:'debtx',amt,debtId:d.id,m:S.month,d:todayDay()};S.tx.push(t);save();rerenderKeepScroll();toast(`اندفع ${fmt(amt)} لـ«${d.name}»`,()=>{S.tx=S.tx.filter(x=>x.id!==t.id);save();rerenderKeepScroll();});}
  else if(act==='add-cat')addCat(a.dataset.layer);
  else if(act==='del-cat')removeWithUndo(S.settings.cats[a.dataset.layer],id);
  else if(act==='add-fixed'){S.fixed.push({id:'f'+uid(),cat:(S.settings.cats.ess[0]||{id:'rent'}).id,amt:0});save();rerenderKeepScroll();}
  else if(act==='del-fixed'){const i=S.fixed.findIndex(f=>f.id===id);if(i<0)return;const [rm]=S.fixed.splice(i,1);save();rerenderKeepScroll();toast('انحذف',()=>{S.fixed.splice(i,0,rm);save();rerenderKeepScroll();});}
  else if(act==='start'){
    if(val('su-open').trim()===''){$('#su-err').textContent='اكتبوا كم عندكم، حتى لو صفر.';return;}
    recomputeBudgets(S);
    if(fullShare(S)<=0){$('#su-err').textContent='حصة البيت لازم تكون أكبر من صفر.';return;}
    S.settings.members=[val('su-m0').trim()||'الأول',val('su-m1').trim()||'الثاني'];
    S.opening=parseAmt(val('su-open'));S.month=thisMonth();S.started=true;payShare(S);autoMonth(S);save();render();
    if(LIVE&&getMe()==null)showPick();
  }
  else if(act==='advance'){ui.count=null;const r=closeMonth(S);save();go('today');toast(`بدأ ${monthLabel(S.month)}`);}
  else if(act==='pick-me')showPick();
  else if(act==='backup'){const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),state:S},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='budget-backup-'+thisMonth()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
  else if(act==='logout'){setPass('');try{localStorage.removeItem(LKEY);localStorage.removeItem('kz-me');}catch(e){}location.reload();}
  else if(act==='reset'){
    if(!ui.confirmReset){ui.confirmReset=true;rerenderKeepScroll();clearTimeout(ui.resetTimer);ui.resetTimer=setTimeout(()=>{if(ui.confirmReset){ui.confirmReset=false;if(ui.tab==='set')rerenderKeepScroll();}},4000);return;}
    ui.confirmReset=false;ui.count=null;S=emptyState(S);S.started=false;save();go('today');
  }
  else if(act==='load-sample'){ui.count=null;S=sample();save();go('today');}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.count){ui.count=ui.count||{vals:{}};ui.count.vals[el.dataset.count]=el.value;return;}
  if(!el.dataset||!el.dataset.set)return;
  const k=el.dataset.set,key=el.dataset.key,n=Math.max(0,Number(el.value)||0);
  if(k==='budget')S.settings.budgets[key]=n;
  else if(k==='brake')S.settings.brake=Math.max(0.5,n);
  else if(k==='tMax')S.settings.tMax=Math.max(1,n);
  else if(k==='member')S.settings.members[Number(key)]=el.value.slice(0,24);
  else if(k==='opening')S.opening=n;
  else if(k==='expected')S.settings.expectedIncome=n;
  else if(k==='catname'){const c=S.settings.cats[el.dataset.layer].find(x=>x.id===key);if(c)c.name=el.value.slice(0,30);}
  else if(k==='catamt'){const c=S.settings.cats[el.dataset.layer].find(x=>x.id===key);if(c)c.amt=n;}
  else if(k==='catfixed'){const c=S.settings.cats[el.dataset.layer].find(x=>x.id===key);if(c)c.fixed=el.checked;}
  else if(k==='fixed-amt'){const f=byId(S.fixed,key);if(f)f.amt=n;}
  else if(k==='fixed-cat'){const f=byId(S.fixed,key);if(f){f.cat=el.value;if(!isDebtCat(f.cat))delete f.debtId;}save();rerenderKeepScroll();return;}
  else if(k==='fixed-debt'){const f=byId(S.fixed,key);if(f){if(el.value)f.debtId=el.value;else delete f.debtId;}}
  save();
  const st=$('#shareTotal');if(st)st.textContent=fmt(fullShare(S));
  for(const l of LAYERS)for(const pre of ['st','su']){const e2=document.getElementById(pre+'-sum-'+l.id);if(e2)e2.textContent=fmt(S.settings.budgets[l.id]);}
  const ft=$('#fixedTotal');if(ft)ft.textContent=fmt(activeFixed().reduce((x,f)=>x+f.amt,0));
  const th=$('#tHint');if(th){th.textContent=tHint();th.classList.toggle('bad',S.settings.tMax<=S.settings.brake);}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.set==='expected')rerenderKeepScroll();});

document.getElementById('gateForm').addEventListener('submit',async e=>{
  e.preventDefault();const pass=$('#g-pass').value;$('#g-err').textContent='';
  if(!pass){$('#g-err').textContent='اكتبوا كلمة السر.';return;}
  try{
    const doc=await api('GET',null,pass);setPass(pass);
    if(base&&doc.rev!==base.rev){base=null;}  // a different household or a fresh login: take the server copy
    mergeFromServer(doc);persistLocal();
    $('#gate').hidden=true;catchUp();render();
    if(!diff().empty)schedulePush();else setSync('ok');
    if(getMe()==null&&S.started!==false)showPick();
  }catch(err){$('#g-err').textContent=err.status===401?'كلمة السر غلط.':'ما قدرنا نوصل. تأكدوا من الإنترنت وجرّبوا مرة ثانية.';}
});
document.getElementById('pickBtns').addEventListener('click',e=>{const b=e.target.closest('[data-me]');if(!b)return;setMe(Number(b.dataset.me));$('#gate').hidden=true;refreshUI(true);});
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(!busy())refreshUI();},150);});

render();
if(LIVE){
  if(!getPass())showGate();else pull();
  setInterval(()=>{if(document.visibilityState==='visible')pull();},20000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull();});
  window.addEventListener('online',()=>{push();pull();});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
})();
</script>
