  h+=`<section class="card"><h2>رصيد البداية</h2><div class="field"><label for="opening">كم كان في الاحتياطي أول ما بديتوا؟ (د.ت)</label><input class="num" id="opening" data-set="opening" type="number" inputmode="numeric" min="0" step="100" value="${S.opening}"></div></section>`;
  if(LIVE){const me=getMe();h+=`<section class="card"><h2>حسابي على هالجوال</h2>
    <div class="row"><span>أنا: <b>${esc(me!=null?set.members[me]:'ما اخترت')}</b></span><button type="button" class="btn small ghost" data-action="pick-me">غيّر</button></div>
    <div class="btn-row"><button type="button" class="btn small ghost" data-action="backup">نزّل نسخة احتياطية</button><button type="button" class="btn small ghost" data-action="logout">تسجيل خروج</button></div>
    <p class="hint">البيانات مشتركة بين جوالاتكم ومحفوظة على Netlify. النسخة الاحتياطية ملف تحفظونه عندكم احتياط.</p></section>`;}
  h+=`<section class="card"><h2>البيانات</h2>
    <p class="small muted">${LIVE?'المسح يمسح البيانات من كل الجوالات.':(S.isSample?'تشوفون الحين أرقام تجريبية.':'هذي بياناتكم أنتم.')+' في النسخة التجريبية البيانات محفوظة في هذا المتصفح فقط.'}</p>
    <button type="button" class="btn ${ui.confirmReset?'danger':'ghost'} block" data-action="reset">${ui.confirmReset?'اضغط مرة ثانية للتأكيد':'امسح كل البيانات وابدأ من الصفر'}</button>
    <p class="hint">يمسح العمليات والالتزامات والأهداف والديون، ويحتفظ بالإعدادات والبنود والمصاريف الثابتة.</p>
    ${LIVE?'':'<button type="button" class="btn ghost block" data-action="load-sample">رجّع الأرقام التجريبية</button>'}</section>`;
  return h;
}
function shareHint(){const a=avgSpend(S);return a?`متوسط مصاريفكم الفعلية في آخر ${a.n} ${a.n===1?'شهر':'شهور'}: ${fmt(a.avg)} د.ت.`:'بعد ما تقفلون أول شهر يطلع لكم متوسط مصاريفكم الفعلي تقارنون فيه الحصة.';}
const splitSum=()=>BUCKETS.reduce((a,[k])=>a+(S.settings.split[k]||0),0);
function splitHint(){const t=splitSum();return t===100?'المجموع 100٪.':`المجموع ${t}٪، لازم يكون 100٪.`;}
function tHint(){const st=S.settings;return st.tMax<=st.brake?'السقف لازم يكون أكبر من حد الترشيد.':`تحت ${st.brake} شهر تنزل الحصة بدون الطبقة المرنة. فوق ${st.tMax} شهور يتوزع الفايض.`;}

function render(){
  const v=$('#view');chartData=null;
  v.innerHTML=ui.tab==='home'?homeView():ui.tab==='tx'?txView():ui.tab==='env'?envView():ui.tab==='plan'?planView():settingsView();
  document.querySelectorAll('.nav-btn').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===ui.tab?'page':'false'));
  if(ui.tab==='plan')bindChart();
}
function go(tab){ui.tab=tab;ui.confirmReset=false;render();window.scrollTo(0,0);}
function rerenderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}

/* ---------- toast ---------- */
let toastTimer=null,undoFn=null;
function toast(msg,undo){
  $('#toastMsg').textContent=msg;undoFn=undo||null;$('#toastUndo').hidden=!undo;$('#toast').hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('#toast').hidden=true;undoFn=null;},undo?6000:4500);
}
$('#toastUndo').addEventListener('click',()=>{if(undoFn)undoFn();$('#toast').hidden=true;undoFn=null;});

/* ---------- entry sheet ---------- */
const form={kind:'exp',cat:null,who:0,debt:null};
function renderSheet(){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===form.kind)));
  let h='';
  if(form.kind==='exp'){
    const mode=monthMode(S,S.month), planned=plannedFor(S,mode);
    for(const l of LAYERS){
      const items=S.settings.cats[l.id];if(!items.length)continue;
      const frozen=planned[l.id]===0&&S.settings.budgets[l.id]>0;
      h+=`<div><div class="group-label"><i class="dot" style="background:var(--l-${l.id})"></i>${l.name}${frozen?' · مجمّد هذا الشهر':''}</div><div class="chips">${items.map(c=>`<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${form.cat===c.id}">${esc(c.name)}</button>`).join('')}</div></div>`;
    }
    if(!h)h=`<p class="small muted">ما فيه بنود. أضفها من الإعدادات.</p>`;
    const open=S.debts.filter(d=>debtLeft(d)>0);
    if(form.cat&&isDebtCat(form.cat)&&open.length){
      h+=`<div><div class="group-label">أي دين؟ (يخصم من الباقي عليه)</div><div class="chips">${open.map(d=>`<button type="button" class="chip" data-debt="${d.id}" aria-pressed="${form.debt===d.id}">${esc(d.name)}</button>`).join('')}<button type="button" class="chip" data-debt="" aria-pressed="${!form.debt}">بدون تحديد</button></div></div>`;
    }
  }else if(form.kind==='emg'){
    h=`<div class="banner warn">${ICON.alert}<div><b>من ظرف الاحتياطي، مو من حصة الشهر</b><p>للي ما ينتظر: علاج، تصليح ضروري، سفر طارئ. مو للطلعات ولا المشتريات.</p></div></div>`;
  }else{
    h=`<div class="banner info">${ICON.info}<p>الإيراد يروح لظرف الاحتياطي مباشرة، وما يدخل في مصروف الشهر.</p></div>`;
  }
  $('#catWrap').innerHTML=h;
  $('#whoWrap').innerHTML=S.settings.members.map((n,i)=>`<button type="button" class="chip" data-who="${i}" aria-pressed="${form.who===i}">${esc(n)}</button>`).join('');
}
function resetWarn(){if(form.warned){form.warned=false;$('#formError').textContent='';$('#txForm button[type=submit]').textContent='حفظ';}}
function openSheet(){
  form.kind='exp';form.cat=null;form.debt=null;form.warned=true;resetWarn();
  if(LIVE&&getMe()!=null)form.who=getMe();
  $('#f-amount').value='';$('#f-note').value='';$('#formError').textContent='';
  renderSheet();$('#sheet').hidden=false;
  setTimeout(()=>{try{$('#f-amount').focus();}catch(e){}},60);
}
function closeSheet(){$('#sheet').hidden=true;if(pendingRender)setTimeout(()=>refreshUI(),0);}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.newCat){e.preventDefault();addCat(e.target.dataset.newCat);}
});
function parseAmt(v){const n=parseFloat(String(v||'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g,'.'));return n>0?Math.round(n*100)/100:0;}
$('#txForm').addEventListener('submit',e=>{
  e.preventDefault();
  const amt=parseAmt($('#f-amount').value);
  if(!amt){$('#formError').textContent='اكتب مبلغ أكبر من صفر.';return;}
  if(form.kind==='exp'&&!form.cat){$('#formError').textContent='اختر بند المصروف.';return;}
  if(form.kind==='exp'&&!form.warned){
    const wi=weekInfo(), fixedCat=activeFixed().some(f=>f.cat===form.cat), hc=houseCash();
    let w='';
    if(amt>hc+0.5)w=`هالمصروف يتعدى اللي باقي في ظرف البيت (${fmt(Math.max(0,hc))}) بـ ${fmt(amt-Math.max(0,hc))}. الفرق بينخصم من الاحتياطي آخر الشهر.`;
    else if(!fixedCat&&amt>wi.left+0.5)w=`هالمصروف يتعدى ظرف هالأسبوع (${fmt(Math.max(0,wi.left))}) بـ ${fmt(amt-Math.max(0,wi.left))}، وبينخصم من الأسابيع الجاية.`;
    if(w){form.warned=true;$('#formError').textContent=w;$('#txForm button[type=submit]').textContent='سجّله برضو';return;}
  }
  const note=$('#f-note').value.trim().slice(0,80);
  if(form.kind==='emg'&&amt>reservoir(S)){$('#formError').textContent='المبلغ أكبر من رصيد الاحتياطي.';return;}
  const t={id:uid(),t:form.kind==='emg'?'emerg':form.kind,amt,who:form.who,note,m:S.month,d:new Date().getDate()};
  if(form.kind==='exp'){const f=findCat(form.cat);t.cat=form.cat;t.cname=f?f.name:'';t.layer=f?f.layer:'ess';if(form.debt&&isDebtCat(form.cat))t.debtId=form.debt;}
  S.tx.push(t);save();closeSheet();render();
  const st=stats(S,S.month);
  const lack=sum3(st.planned)-st.paid;
  if(form.kind==='inc'&&lack>0.5&&S.started!==false){
    const add=Math.min(lack,reservoir(S));
    if(add>0.5){S.tx.push({id:uid(),t:'salary',amt:add,mode:st.mode,m:S.month,d:new Date().getDate()});save();render();}
    toast(`إيراد ${fmt(amt)} د.ت راح للاحتياطي، ومنه اكتملت حصة الشهر (+${fmt(add)})`);
  }
  else toast(form.kind==='exp'?`تسجّل مصروف ${fmt(amt)} د.ت`:form.kind==='emg'?`طارئ ${fmt(amt)} د.ت انخصم من ظرف الاحتياطي`:`إيراد ${fmt(amt)} د.ت راح للاحتياطي`);
});

/* ---------- settings: categories ---------- */
function addCat(layer){
  const input=$('#new-'+layer);if(!input)return;
  const name=input.value.trim().slice(0,30);
  if(!name){input.focus();return;}
  S.settings.cats[layer].push({id:'c'+uid(),name});save();rerenderKeepScroll();
  toast(`انضاف «${name}» في ${layerName(layer)}`);
  const n=$('#new-'+layer);if(n){try{n.focus();}catch(e){}}
}
function removeWithUndo(arr,id,label){
  const i=arr.findIndex(x=>x.id===id);if(i<0)return;
  const [removed]=arr.splice(i,1);save();rerenderKeepScroll();
  toast(`انحذف «${removed.name}»`,()=>{arr.splice(i,0,removed);save();rerenderKeepScroll();});
}
const val=id=>{const el=$('#'+id);return el?el.value:'';};

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const tabBtn=e.target.closest('.nav-btn[data-tab]');if(tabBtn){go(tabBtn.dataset.tab);return;}
  const goBtn=e.target.closest('[data-tab-go]');if(goBtn){go(goBtn.dataset.tabGo);return;}
  const kind=e.target.closest('[data-kind]');if(kind){form.kind=kind.dataset.kind;form.cat=null;form.debt=null;resetWarn();renderSheet();return;}
  const cat=e.target.closest('[data-cat]');if(cat){form.cat=cat.dataset.cat;if(!isDebtCat(form.cat))form.debt=null;resetWarn();renderSheet();return;}
  const debt=e.target.closest('[data-debt]');if(debt){form.debt=debt.dataset.debt||null;renderSheet();return;}
  const who=e.target.closest('[data-who]');if(who){form.who=Number(who.dataset.who);renderSheet();return;}
  const a=e.target.closest('[data-action]');if(!a||a.disabled)return;
  const act=a.dataset.action, id=a.dataset.id;
  if(act==='open-sheet')openSheet();
  else if(act==='close-sheet')closeSheet();
  else if(act==='advance'){
    const before=modeFor(S,reservoir(S));ui.count=null;
    const r=closeMonth(S);save();render();window.scrollTo(0,0);
    let msg=`قفلنا ${monthShort(r.old)}: ${r.left>=0?'رجع '+fmt(r.left)+' للاحتياطي':'تجاوز '+fmt(-r.left)+' انخصم من الاحتياطي'}. نزلت حصة ${monthShort(S.month)} ${fmt(r.pay.amt)} د.ت.`;
    if(r.pay.mode!==before&&r.pay.mode==='austerity')msg+=' دخلتوا '+MODE_LABEL[r.pay.mode]+'.';
    if(dueNow().length)msg+=' عندكم التزام مستحق.';
    toast(msg);
  }
  else if(act==='topup'){
    const st=stats(S,S.month), res=reservoir(S), amt=Math.min(sum3(st.planned)-st.paid,res);
    if(amt>0){S.tx.push({id:uid(),t:'salary',amt,mode:st.mode,m:S.month,d:new Date().getDate()});save();render();toast(`نزل ${fmt(amt)} د.ت من الاحتياطي لحصة الشهر`);}
  }
  else if(act==='distribute'){
    const sur=surplusOf(S);if(sur<=0)return;
    BUCKETS.forEach(([k])=>{const v=Math.round(sur*S.settings.split[k]/100);if(v>0)S.tx.push({id:uid(),t:'dist',amt:v,to:k,m:S.month,d:new Date().getDate()});});
    save();render();toast(`توزّع ${fmt(sur)} د.ت على الصناديق`);
  }
  else if(act==='del'){
    const i=S.tx.findIndex(t=>t.id===id);if(i<0)return;
    const [removed]=S.tx.splice(i,1);save();rerenderKeepScroll();
    toast('انحذفت العملية',()=>{S.tx.splice(i,0,removed);save();rerenderKeepScroll();});
  }
  else if(act==='add-cat')addCat(a.dataset.layer);
  else if(act==='del-cat')removeWithUndo(S.settings.cats[a.dataset.layer],id);
  /* plan: obligations */
  else if(act==='add-plan'){
    const name=val('np-name').trim().slice(0,30), amt=parseAmt(val('np-amt')), mm=Number(val('np-mm')), yy=Number(val('np-yy')), yearly=$('#np-yearly').checked;
    if(!name){$('#np-err').textContent='اكتب اسم الالتزام.';return;}
    if(!amt){$('#np-err').textContent='اكتب المبلغ.';return;}
    if(mkey(yy,mm)<S.month&&!yearly){$('#np-err').textContent='التاريخ فات. اختر شهر جاي.';return;}
    S.plans.push({id:'p'+uid(),name,amt,mm,yy,yearly});save();rerenderKeepScroll();toast(`انضاف «${name}» للالتزامات`);
  }
  else if(act==='del-plan')removeWithUndo(S.plans,id);
  else if(act==='pay-plan'){
    const p=byId(S.plans,id);if(!p)return;
    S.tx.push({id:uid(),t:'planned',amt:p.amt,planId:p.id,pname:p.name,occ:a.dataset.occ,m:S.month,d:new Date().getDate()});
    save();rerenderKeepScroll();toast(`اندفع «${p.name}» ${fmt(p.amt)} د.ت من الاحتياطي`);
  }
  /* plan: goals */
  else if(act==='add-goal'){
    const name=val('ng-name').trim().slice(0,30), target=parseAmt(val('ng-amt')), mm=Number(val('ng-mm')), yy=Number(val('ng-yy'));
    if(!name){$('#ng-err').textContent='اكتب اسم الهدف.';return;}
    if(!target){$('#ng-err').textContent='اكتب المبلغ المطلوب.';return;}
    if(mm&&mkey(yy,mm)<=S.month){$('#ng-err').textContent='اختر موعد بعد هذا الشهر.';return;}
    S.goals.push({id:'g'+uid(),name,target,mm:mm||null,yy:mm?yy:null,done:false});save();rerenderKeepScroll();toast(`انضاف هدف «${name}»`);
  }
  else if(act==='del-goal')removeWithUndo(S.goals,id);
  else if(act==='goal-up'||act==='goal-down'){
    const act2=S.goals.filter(g=>!g.done), i=act2.findIndex(g=>g.id===id), j=act==='goal-up'?i-1:i+1;
    if(i<0||j<0||j>=act2.length)return;
    const gi=S.goals.indexOf(act2[i]), gj=S.goals.indexOf(act2[j]);[S.goals[gi],S.goals[gj]]=[S.goals[gj],S.goals[gi]];
    save();rerenderKeepScroll();
  }
  else if(act==='goal-done'){
    const g=byId(S.goals,id);if(!g)return;
    const t={id:uid(),t:'goalspend',amt:g.target,goalId:g.id,m:S.month,d:new Date().getDate()};
    S.tx.push(t);g.done=true;save();rerenderKeepScroll();
    toast(`مبروك! تحقق «${g.name}»`,()=>{S.tx=S.tx.filter(x=>x.id!==t.id);g.done=false;save();rerenderKeepScroll();});
  }
  else if(act==='goal-transfer'){
    const amt=parseAmt(val('gt-amt')), res=reservoir(S), fs=fullShare(S);
    if(!amt)return;
    if(amt>res){toast('المبلغ أكبر من رصيد الاحتياطي.');return;}
    S.tx.push({id:uid(),t:'dist',amt,to:'goals',manual:true,m:S.month,d:new Date().getDate()});save();rerenderKeepScroll();
    const cov=fs?(res-amt)/fs:0;
    toast(`تحوّل ${fmt(amt)} د.ت للأهداف. الاحتياطي الحين يغطي ${cov.toFixed(1)} شهر${cov<S.settings.brake?'، يعني ترشيد':''}.`);
  }
  /* plan: debts */
  else if(act==='add-debt'){
    const name=val('nd-name').trim().slice(0,30), amount=parseAmt(val('nd-amt')), inst=parseAmt(val('nd-inst'));
    if(!name){$('#nd-err').textContent='اكتب اسم الدين.';return;}
    if(!amount||!inst){$('#nd-err').textContent='اكتب المبلغ الباقي والقسط الشهري.';return;}
    S.debts.push({id:'d'+uid(),name,amount,inst});save();rerenderKeepScroll();toast(`انضاف «${name}». سجّلوا أقساطه من + ببند سداد الديون.`);
  }
  else if(act==='del-debt')removeWithUndo(S.debts,id);
  else if(act==='debt-inst'||act==='debt-extra'){
    const d=byId(S.debts,id);if(!d)return;const amt=Math.min(d.inst,debtLeft(d));if(!amt)return;
    let t;
    if(act==='debt-inst'){
      const f=findCat('debt')||(S.settings.cats.ess[0]&&{layer:'ess',name:S.settings.cats.ess[0].name});
      t={id:uid(),t:'exp',amt,cat:findCat('debt')?'debt':(S.settings.cats.ess[0]||{}).id,cname:f?f.name:'سداد الديون',layer:'ess',debtId:d.id,who:0,note:'',m:S.month,d:new Date().getDate()};
    }else{
      if(amt>reservoir(S)){toast('الاحتياطي ما يكفي لهالدفعة.');return;}
      t={id:uid(),t:'debtx',amt,debtId:d.id,m:S.month,d:new Date().getDate()};
    }
    S.tx.push(t);save();rerenderKeepScroll();
    toast(act==='debt-inst'?`تسجّل قسط «${d.name}» ${fmt(amt)} د.ت من حصة الشهر`:`اندفع ${fmt(amt)} د.ت لـ«${d.name}» من الاحتياطي`,()=>{S.tx=S.tx.filter(x=>x.id!==t.id);save();rerenderKeepScroll();});
  }
  else if(act==='start'){
    const open=parseAmt(val('su-open'));
    if(val('su-open').trim()===''){$('#su-err').textContent='اكتبوا كم عندكم الحين، حتى لو صفر.';return;}
    LAYERS.forEach(l=>{S.settings.budgets[l.id]=Math.max(0,Number(val('su-'+l.id))||0);});
    S.settings.members=[val('su-m0').trim()||'الأول',val('su-m1').trim()||'الثاني'];
    if(fullShare(S)<=0){$('#su-err').textContent='حصة البيت لازم تكون أكبر من صفر.';return;}
    S.opening=open;S.month=thisMonth();S.started=true;payShare(S);save();render();
    toast(`بدأتوا! نزلت حصة ${monthShort(S.month)} ${fmt(stats(S,S.month).paid)} د.ت لظرف البيت.`);
    if(LIVE&&getMe()==null)showPick();
  }
  else if(act==='pick-me')showPick();
  else if(act==='backup'){
    const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),state:S},null,1)],{type:'application/json'});
    const u=URL.createObjectURL(blob), l=document.createElement('a');l.href=u;l.download='budget-backup-'+thisMonth()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
  }
  else if(act==='logout'){setPass('');try{localStorage.removeItem(LKEY);localStorage.removeItem('kz-me');}catch(e){}location.reload();}
  /* envelopes */
  else if(act==='pay-fixed'){
    const wi=weekInfo();if(!wi.unpaid.length)return;
    const added=wi.unpaid.map(f=>{const c=findCat(f.cat)||{layer:'ess',name:'مصروف ثابت'};const t={id:uid(),t:'exp',amt:f.amt,cat:f.cat,cname:c.name,layer:c.layer,fixedId:f.id,who:0,note:'',m:S.month,d:1};if(f.debtId&&debtLeft(byId(S.debts,f.debtId)||{amount:0,id:''})>0)t.debtId=f.debtId;return t;});
    S.tx.push(...added);save();rerenderKeepScroll();
    const ids=new Set(added.map(t=>t.id));
    toast(`تسجّلت ${added.length} مصاريف ثابتة`,()=>{S.tx=S.tx.filter(t=>!ids.has(t.id));save();rerenderKeepScroll();});
  }
  else if(act==='ritual-split'){const r=S.ritual[S.month]||{};r.split=!r.split;S.ritual[S.month]=r;save();rerenderKeepScroll();}
  else if(act==='count'){
    const v={};['c-house','c-rcash','c-rbank','c-goals'].forEach(k=>{const x=val(k).trim();v[k]=x===''?null:Number(x.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)));});
    const rows=[];const b=buckets(S);
    if(v['c-house']!=null)rows.push({key:'house',label:'ظرف البيت',diff:v['c-house']-houseCash()});
    if(v['c-rcash']!=null||v['c-rbank']!=null)rows.push({key:'res',label:'الاحتياطي',diff:(v['c-rcash']||0)+(v['c-rbank']||0)-reservoir(S)});
    if(v['c-goals']!=null)rows.push({key:'goals',label:'الأهداف',diff:v['c-goals']-bucketsTotal(b)});
    if(!rows.length){toast('اكتبوا رقم واحد على الأقل');return;}
    ui.count={vals:v,rows,tooMuchCash:Math.max(0,(v['c-rcash']||0)-fullShare(S))};
    S.lastCount={m:S.month,d:todayDay()};save();rerenderKeepScroll();
  }
  else if(act==='count-fix'){
    const k=a.dataset.key, rw=ui.count&&ui.count.rows.find(x=>x.key===k);if(!rw)return;
    const d=Math.round(rw.diff*100)/100;
    if(k==='house')S.tx.push({id:uid(),t:'exp',amt:-d,cat:'adj',cname:d<0?'مصروف ما تسجّل (جرد)':'تصحيح جرد',layer:'flex',who:0,note:'',m:S.month,d:todayDay()});
    else if(k==='res')S.tx.push({id:uid(),t:'adj',amt:d,m:S.month,d:todayDay()});
    else S.tx.push({id:uid(),t:'gadj',amt:d,m:S.month,d:todayDay()});
    rw.diff=0;save();rerenderKeepScroll();toast('تعدّلت الأرقام على المعدود');
  }
  else if(act==='add-fixed'){const first=(S.settings.cats.ess[0]||S.settings.cats.imp[0]||{id:'rent'}).id;S.fixed.push({id:'f'+uid(),cat:first,amt:0});save();rerenderKeepScroll();}
  else if(act==='del-fixed'){const i=S.fixed.findIndex(f=>f.id===id);if(i<0)return;const [rm]=S.fixed.splice(i,1);save();rerenderKeepScroll();toast('انحذف المصروف الثابت',()=>{S.fixed.splice(i,0,rm);save();rerenderKeepScroll();});}
  else if(act==='reset'){
    if(!ui.confirmReset){ui.confirmReset=true;rerenderKeepScroll();clearTimeout(ui.resetTimer);ui.resetTimer=setTimeout(()=>{if(ui.confirmReset){ui.confirmReset=false;if(ui.tab==='set')rerenderKeepScroll();}},4000);return;}
    ui.confirmReset=false;ui.count=null;S=emptyState(S);if(LIVE)S.started=false;save();render();toast('بدأتوا من الصفر. اكتب رصيد البداية تحت، وبعدها كمّل حصة الشهر من الرئيسية.');
    setTimeout(()=>{const o=$('#opening');if(o){o.scrollIntoView({block:'center'});try{o.focus();}catch(e){}}},50);
  }
  else if(act==='load-sample'){ui.count=null;S=sample();save();go('home');toast('رجعت الأرقام التجريبية');}
});

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='f-amount'){resetWarn();return;}
  if(el.dataset&&el.dataset.count){ui.count=ui.count||{vals:{}};ui.count.vals[el.dataset.count]=el.value;return;}
  if(!el.dataset||!el.dataset.set)return;
  const k=el.dataset.set, key=el.dataset.key, n=Math.max(0,Number(el.value)||0);
  if(k==='budget')S.settings.budgets[key]=n;
  else if(k==='split')S.settings.split[key]=Math.min(100,n);
  else if(k==='brake')S.settings.brake=Math.max(0.5,n);
  else if(k==='tMax')S.settings.tMax=Math.max(1,n);
  else if(k==='member')S.settings.members[Number(key)]=el.value.slice(0,24);
  else if(k==='opening')S.opening=n;
  else if(k==='expected')S.settings.expectedIncome=n;
  else if(k==='catname'){const c=S.settings.cats[el.dataset.layer].find(x=>x.id===key);if(c)c.name=el.value.slice(0,30);}
  else if(k==='fixed-amt'){const f=byId(S.fixed,key);if(f)f.amt=n;const ft=$('#fixedTotal');if(ft)ft.textContent=fmt(activeFixed().reduce((a,x)=>a+x.amt,0));}
  else if(k==='fixed-cat'){const f=byId(S.fixed,key);if(f){f.cat=el.value;if(!isDebtCat(f.cat))delete f.debtId;}save();rerenderKeepScroll();return;}
  else if(k==='fixed-debt'){const f=byId(S.fixed,key);if(f){if(el.value)f.debtId=el.value;else delete f.debtId;}}
  save();
  const st=$('#shareTotal');if(st)st.textContent=fmt(fullShare(S));
  const sh=$('#splitHint');if(sh){sh.textContent=splitHint();sh.classList.toggle('bad',splitSum()!==100);}
  const th=$('#tHint');if(th){th.textContent=tHint();th.classList.toggle('bad',S.settings.tMax<=S.settings.brake);}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.set==='expected')rerenderKeepScroll();});

document.getElementById('gateForm').addEventListener('submit',async e=>{
  e.preventDefault();const pass=$('#g-pass').value;$('#g-err').textContent='';
  if(!pass){$('#g-err').textContent='اكتبوا كلمة السر.';return;}
  try{
    const doc=await api('GET',null,pass);setPass(pass);
    if(base&&doc.rev!==base.rev){base=null;}  // a different household or a fresh login: take the server copy
    mergeFromServer(doc);persistLocal();
    $('#gate').hidden=true;catchUp();render();
    if(!diff().empty)schedulePush();else setSync('ok');
    if(getMe()==null&&S.started!==false)showPick();
  }catch(err){$('#g-err').textContent=err.status===401?'كلمة السر غلط.':'ما قدرنا نوصل. تأكدوا من الإنترنت وجرّبوا مرة ثانية.';}
});
document.getElementById('pickBtns').addEventListener('click',e=>{const b=e.target.closest('[data-me]');if(!b)return;setMe(Number(b.dataset.me));$('#gate').hidden=true;refreshUI(true);});
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(!busy())refreshUI();},150);});

render();
if(LIVE){
  if(!getPass())showGate();else pull();
  setInterval(()=>{if(document.visibilityState==='visible')pull();},20000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull();});
  window.addEventListener('online',()=>{push();pull();});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
})();
</script>
