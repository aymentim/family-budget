<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="budget-live" content="1">
<meta name="theme-color" content="#1F5FD1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الميزانية">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon-v2.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ميزانية العائلة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, bottom nav with a center add button, bottom sheet for entries */
:root{
  --bg:#F4F6FB;--surface:#FFFFFF;--surface-2:#E9EDF5;--line:#E0E5EF;--fg:#161B2E;--muted:#5A6378;
  --accent:#1F5FD1;--on-accent:#FFFFFF;--accent-soft:#E4ECFD;--accent-soft-fg:#163E99;
  --l-ess:#1F5FD1;--l-imp:#8B5CF6;--l-flex:#F26B3A;
  --hero:#1F5FD1;--hero-fg:#FFFFFF;--hero-sub:#D9E4FB;--hero-warn:#C2410C;--hero-warn-sub:#FFE3D4;
  --warn-bg:#FFF0DB;--warn-fg:#8A4100;--danger:#C81E3A;--danger-bg:#FDE6EA;--backdrop:rgba(14,20,40,.45);
  --pos:#0E8A5F;--pos-soft:#DDF5EA;--pos-soft-fg:#0A5E41;
  --c-house:#F26B3A;--c-house-soft:#FFE8DE;--c-house-fg:#A3380F;
  --c-goal:#E3A008;--c-goal-soft:#FFF4D6;--c-goal-fg:#7A5300;--c-week:#12A37A;
  --c-exp:#007E5C;--c-cons:#3A7FD0;--c-none:#C2570A;--band-safe:rgba(31,95,209,.10);--band-low:rgba(242,107,58,.13);--grid:#E3E7EF;--env-flap:#D5DCEA;
  --font-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --font-num:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1320;--surface:#191E2E;--surface-2:#252B3E;--line:#2C3347;--fg:#E8EBF4;--muted:#9AA3B8;
  --accent:#6B9BFF;--on-accent:#0A1430;--accent-soft:#1E2C55;--accent-soft-fg:#C9D8FF;
  --l-ess:#6B9BFF;--l-imp:#A78BFA;--l-flex:#FF8A5C;
  --hero:#2347A8;--hero-fg:#FFFFFF;--hero-sub:#CAD8FA;--hero-warn:#8A3210;--hero-warn-sub:#FFD9C6;
  --warn-bg:#3A2A12;--warn-fg:#FFC98A;--danger:#FF7A8E;--danger-bg:#3E1A22;--backdrop:rgba(0,0,0,.6);
  --pos:#3DD6A0;--pos-soft:#123A2E;--pos-soft-fg:#A8F0D4;
  --c-house:#FF8A5C;--c-house-soft:#3A2218;--c-house-fg:#FFC4AA;
  --c-goal:#F5C242;--c-goal-soft:#3A3014;--c-goal-fg:#FCE2A0;--c-week:#2FCB97;
  --c-exp:#14A07E;--c-cons:#4B8FE0;--c-none:#D9712A;--band-safe:rgba(107,155,255,.13);--band-low:rgba(255,138,92,.15);--grid:#2C3347;--env-flap:#34405A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1320;--surface:#191E2E;--surface-2:#252B3E;--line:#2C3347;--fg:#E8EBF4;--muted:#9AA3B8;
  --accent:#6B9BFF;--on-accent:#0A1430;--accent-soft:#1E2C55;--accent-soft-fg:#C9D8FF;
  --l-ess:#6B9BFF;--l-imp:#A78BFA;--l-flex:#FF8A5C;
  --hero:#2347A8;--hero-fg:#FFFFFF;--hero-sub:#CAD8FA;--hero-warn:#8A3210;--hero-warn-sub:#FFD9C6;
  --warn-bg:#3A2A12;--warn-fg:#FFC98A;--danger:#FF7A8E;--danger-bg:#3E1A22;--backdrop:rgba(0,0,0,.6);
  --pos:#3DD6A0;--pos-soft:#123A2E;--pos-soft-fg:#A8F0D4;
  --c-house:#FF8A5C;--c-house-soft:#3A2218;--c-house-fg:#FFC4AA;
  --c-goal:#F5C242;--c-goal-soft:#3A3014;--c-goal-fg:#FCE2A0;--c-week:#2FCB97;
  --c-exp:#14A07E;--c-cons:#4B8FE0;--c-none:#D9712A;--band-safe:rgba(107,155,255,.13);--band-low:rgba(255,138,92,.15);--grid:#2C3347;--env-flap:#34405A;
  color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(112px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:14px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .eyebrow{font-size:13px;color:var(--muted)}
.top h1{font-family:var(--font-num);font-size:22px;font-weight:600}
.top-end{display:flex;align-items:center;gap:8px}
.avatars{display:flex}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;border:2px solid var(--bg);flex-shrink:0}
.av.a0{background:var(--accent);color:var(--on-accent)}
.av.a1{background:var(--accent-soft);color:var(--accent-soft-fg)}
.avatars .av+.av{margin-inline-start:-10px}
.gear{width:44px;height:44px;border-radius:50%;border:none;background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gear[aria-current="page"]{background:var(--accent);color:var(--on-accent)}

.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:15px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.top-align{align-items:flex-start}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 4px 0}
.section-title h2{font-size:17px;font-family:var(--font-num);font-weight:600}

.hero{background:var(--hero);color:var(--hero-fg);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero.warn{background:var(--hero-warn)}
.hero .sub{color:var(--hero-sub);font-size:13px}
.hero.warn .sub{color:var(--hero-warn-sub)}
.hero .big{font-family:var(--font-num);font-size:34px;font-weight:600;line-height:1.2}
.hero .cur{font-size:14px;font-weight:400}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.cov{display:flex;align-items:baseline;gap:8px}
.cov .num{font-size:26px;font-weight:600}
.gauge{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.16)}
.gauge .zone{position:absolute;inset-block:0;background:rgba(255,255,255,.2);border-radius:999px}
.gauge .fill{position:absolute;inset-block:2px;inset-inline-start:2px;background:#FFFFFF;border-radius:999px;max-width:calc(100% - 4px)}
.legend{display:flex;justify-content:space-between;font-size:11px}
.hero .runway{border-top:1px solid rgba(255,255,255,.18);padding-top:10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}

.banner{border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.banner svg{flex-shrink:0;margin-top:3px}
.banner b{display:block;font-size:14px}
.banner p{font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--warn-fg)}
.banner.info{background:var(--accent-soft);color:var(--accent-soft-fg)}
.banner.danger{background:var(--danger-bg);color:var(--danger)}

.layer{display:flex;flex-direction:column;gap:6px}
.lname{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.bar{height:8px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden}
.bar>div{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.tag{font-size:11px;border-radius:999px;padding:1px 8px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.tag.ok{background:var(--pos-soft);color:var(--pos-soft-fg)}
.tag.bad{background:var(--danger-bg);color:var(--danger)}
.locked{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13px}
.locked span{display:flex;align-items:center;gap:8px}

.salary .amount{font-family:var(--font-num);font-size:18px;font-weight:600}
.over{color:var(--danger);font-weight:600}

.btn{min-height:48px;border-radius:14px;border:none;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;padding:0 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{min-height:44px;font-size:14px;padding:0 14px}
.btn.danger{background:var(--danger);color:#FFFFFF}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.link-btn{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;min-height:40px;padding:0 8px;border-radius:10px;cursor:pointer}
.link-btn:hover{background:var(--surface-2)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

.txlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tx{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.tx .av{width:30px;height:30px;font-size:12px;border:none}
.tx .av.sys{background:var(--surface-2);color:var(--muted)}
.tx .body{flex:1;min-width:0;display:flex;flex-direction:column}
.tx .title{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.tx .meta{font-size:12px;color:var(--muted)}
.tx .amt{font-size:14px;white-space:nowrap}
.tx.pos .amt{color:var(--pos);font-weight:600}
.tx.sys{background:transparent;border:1px dashed var(--line)}
.tx.sys .title{color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.3;cursor:default}
.month-head{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 0;font-size:13px;gap:8px;flex-wrap:wrap}
.month-head b{font-size:15px}

.sim{border:1px dashed var(--line);background:transparent}

.alloc{display:flex;flex-direction:column;gap:6px}
.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bucket{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bucket span:first-child{font-size:12px;color:var(--muted)}
.bucket .num{font-size:16px;font-weight:600}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
td.num{font-size:13px;text-align:right}
.tx .amt,.tip .num,td.num{direction:ltr;unicode-bidi:isolate}

.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.field input,.field select,.cat-item input,.add-cat input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:15px;width:100%;min-width:0}
.field input.num{font-family:var(--font-num)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.hint.bad{color:var(--danger);font-weight:600}
.big-line{display:flex;align-items:baseline;gap:6px}
.big-line .num{font-size:30px;font-weight:600}

.cat-group{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.cat-group+.cat-group{border-top:1px solid var(--line);padding-top:14px}
.cat-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cat-item{display:flex;align-items:center;gap:6px}
.cat-item input{flex:1;height:44px}
.add-cat{display:flex;gap:8px}
.add-cat input{flex:1;height:44px;background:transparent;border-style:dashed}
.add-cat .btn{flex-shrink:0}

/* plan */
.breakdown{display:flex;flex-direction:column;gap:2px}
.breakdown .row{min-height:30px;font-size:14px}
.breakdown .row.total{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:600}
.need-big{display:flex;align-items:baseline;gap:6px}
.need-big .num{font-size:32px;font-weight:600;line-height:1.2}
.dry{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dry li{display:flex;justify-content:space-between;gap:10px;font-size:14px;align-items:baseline}
.dry li b{font-family:var(--font-num);font-weight:600;white-space:nowrap}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.chart-legend span{display:flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top-width:2.5px;border-top-color:currentColor;display:inline-block}
.sw.exp{border-top-style:solid;color:var(--c-exp)}
.sw.cons{border-top-style:dashed;color:var(--c-cons)}
.sw.none{border-top-style:dotted;color:var(--c-none);border-top-width:3px}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln.exp{stroke:var(--c-exp)}
.ln.cons{stroke:var(--c-cons);stroke-dasharray:6 4}
.ln.none{stroke:var(--c-none);stroke-dasharray:1.5 4;stroke-width:2.5}
.ax{fill:var(--muted);font-size:10px;font-family:var(--font-num)}
.endlab{font-size:10px;font-family:var(--font-num);fill:var(--fg)}
.gridl{stroke:var(--grid);stroke-width:1}
.band-safe{fill:var(--band-safe)}
.band-low{fill:var(--band-low)}
.band-lab{font-size:9px;fill:var(--muted);font-family:var(--font-body)}
.cross{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;top:4px;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;pointer-events:none;min-width:130px;z-index:2;line-height:1.6}
.tip .t-row{display:flex;justify-content:space-between;gap:12px}
.tip .t-row i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:6px}
details.more summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;min-height:40px;display:flex;align-items:center}
details.adder{border:1px dashed var(--line);border-radius:14px;padding:0 12px}
details.adder[open]{padding-bottom:12px}
details.adder summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;min-height:48px;display:flex;align-items:center;list-style:none}
details.adder summary::-webkit-details-marker{display:none}
.adder-body{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none;padding-top:0}
.item .name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.item .meta{font-size:12px;color:var(--muted)}
.item .amt{font-family:var(--font-num);font-weight:600;white-space:nowrap}
.item-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.empty{font-size:13px;color:var(--muted);padding:4px 0}

/* envelopes */
.total{display:flex;flex-direction:column;gap:10px}
.total .big-line .num{font-size:30px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.stack>span{display:block;height:100%}
.tot-rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tot-rows div{display:flex;flex-direction:column;gap:2px;min-width:0}
.tot-rows .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tot-rows .num{font-size:15px;font-weight:600}
.cats{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.cats li{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding-inline-start:18px}
.cats li b{color:var(--fg);font-weight:500;font-family:var(--font-num)}
.envs{background:var(--surface);border-radius:18px;padding:4px 16px;display:flex;flex-direction:column}
.env{display:flex;gap:12px;align-items:center;padding-block:14px}
.env+.env{border-top:1px solid var(--line)}
.env .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent-soft-fg)}
.env .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.env .body b{font-size:15px;font-weight:600}
.env .body span{font-size:12px;color:var(--muted);line-height:1.5}
.env .amt{font-family:var(--font-num);font-size:19px;font-weight:600;white-space:nowrap}
.env .amt small{font-size:12px;font-weight:400;color:var(--muted);margin-inline-start:3px}
.env.house .ico{background:var(--c-house-soft);color:var(--c-house-fg)}
.env.goal .ico{background:var(--c-goal-soft);color:var(--c-goal-fg)}
.env.warn .ico{background:var(--warn-bg);color:var(--warn-fg)}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wk{border-radius:12px;padding:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;min-width:0;border:2px solid transparent}
.wk.now{border-color:var(--c-week);background:var(--surface)}
.wk.past{opacity:.75}
.wk .lab{font-size:11px;color:var(--muted)}
.wk .v{font-family:var(--font-num);font-size:14px;font-weight:600}
.wk .bar{height:5px}
.week-big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.week-big .num{font-size:30px;font-weight:600;line-height:1.2}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .mark{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-num);font-size:13px;color:var(--muted)}
.step.done .mark{background:var(--pos);border-color:var(--pos);color:var(--surface)}
.step .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.step .txt b{font-size:14px}
.step .txt p{font-size:13px;color:var(--muted)}
.step.done .txt b{color:var(--muted);text-decoration:line-through}
.rules{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.rules li::marker{color:var(--accent);font-family:var(--font-num);font-weight:600}
.count-res{display:flex;flex-direction:column;gap:8px}
.count-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px}
.count-row.ok{background:var(--pos-soft);color:var(--pos-soft-fg)}
.count-row.off{background:var(--warn-bg);color:var(--warn-fg)}
.fixed-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 40px;gap:8px;align-items:center}
.fixed-row select,.fixed-row input{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:14px;width:100%;min-width:0}
.fixed-row .debt-link{grid-column:1 / span 2}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:20}
.tabbar-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;height:72px}
.nav-btn{background:none;border:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-height:48px;justify-content:center;cursor:pointer}
.nav-btn[aria-current="page"]{color:var(--accent);font-weight:600}
.fab{justify-self:center;width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;margin-top:-30px;box-shadow:0 6px 18px rgba(31,95,209,.38);cursor:pointer}

.sheet{position:fixed;inset:0;background:var(--backdrop);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.seg{background:var(--surface-2);border-radius:14px;padding:4px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.seg button{height:44px;border:none;border-radius:11px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.amount-box{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.amount-box input{border:none;outline:none;background:transparent;text-align:center;font-family:var(--font-num);font-size:42px;font-weight:600;width:100%;max-width:220px}
.amount-box input:focus-visible{outline:2px solid var(--accent);border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.group-label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.form-error{color:var(--danger);font-size:13px;font-weight:600;min-height:20px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 14px;font-size:13px;z-index:60;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast button{background:none;border:none;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer;min-height:36px}

.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:2px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos)}
.sync[data-s="pending"]::before,.sync[data-s="saving"]::before{background:var(--c-cons)}
.sync[data-s="offline"]::before,.sync[data-s="auth"]::before{background:var(--c-none)}
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.gate-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.gate-box h1{font-family:var(--font-num);font-size:26px}
.gate-box .field input{height:52px;font-size:17px}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick button{min-height:88px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:17px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pick .av{width:40px;height:40px;font-size:16px}
@media (prefers-reduced-motion: no-preference){
  .panel{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>


<div dir="rtl">
<div class="app">
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="التنقل">
  <div class="tabbar-inner">
    <button class="nav-btn" data-tab="home" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      الرئيسية
    </button>
    <button class="nav-btn" data-tab="tx" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      العمليات
    </button>
    <button class="fab" type="button" data-action="open-sheet" aria-label="إضافة عملية">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="nav-btn" data-tab="plan" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>
      الخطة
    </button>
    <button class="nav-btn" data-tab="env" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>
      الظروف
    </button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <form class="panel" id="txForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <div class="row">
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="إغلاق" style="background:var(--surface);width:44px;height:44px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h2 id="sheetTitle" class="num" style="font-size:18px">عملية جديدة</h2>
      <span style="width:44px"></span>
    </div>
    <div class="seg" role="group" aria-label="نوع العملية">
      <button type="button" data-kind="exp" aria-pressed="true">مصروف</button>
      <button type="button" data-kind="inc" aria-pressed="false">إيراد</button>
      <button type="button" data-kind="emg" aria-pressed="false">طارئ</button>
    </div>
    <div class="amount-box">
      <label for="f-amount" class="small muted">المبلغ (د.ت)</label>
      <input id="f-amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
    </div>
    <div id="catWrap" style="display:flex;flex-direction:column;gap:12px"></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="small" style="font-weight:600">مين سجّل؟</div>
      <div class="chips" id="whoWrap"></div>
    </div>
    <div class="field">
      <label for="f-note">ملاحظة (اختياري)</label>
      <input id="f-note" type="text" autocomplete="off" placeholder="مثلاً: سوق الأسبوع">
    </div>
    <div class="form-error" id="formError" role="alert"></div>
    <button type="submit" class="btn block">حفظ</button>
  </form>
</div>

<div class="gate" id="gate" hidden>
  <form class="gate-box" id="gateForm" novalidate>
    <h1>ميزانية العائلة</h1>
    <p class="muted">اكتبوا كلمة سر العائلة. تنكتب مرة وحدة على كل جوال.</p>
    <div class="field"><label for="g-pass">كلمة السر</label><input id="g-pass" type="password" autocomplete="current-password" required></div>
    <p class="form-error" id="g-err" role="alert"></p>
    <button type="submit" class="btn block">دخول</button>
  </form>
  <div class="gate-box" id="pickMe" hidden>
    <h1>مين أنت؟</h1>
    <p class="muted">عشان تنكتب العمليات باسمك. تقدر تغيّره من الإعدادات.</p>
    <div class="pick" id="pickBtns"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastUndo" hidden>تراجع</button></div>
</div>

<script>
(function(){
document.documentElement.lang='ar';

const KEY='khazzan-proto-v1';
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const LAYERS=[{id:'ess',name:'أساسي'},{id:'imp',name:'مهم'},{id:'flex',name:'مرن'}];
const DEFAULT_CATS=()=>({
  ess:[{id:'rent',name:'إيجار'},{id:'food',name:'أكل وخضرة'},{id:'bills',name:'فواتير'},{id:'kid',name:'الطفل'},{id:'debt',name:'سداد الديون'}],
  imp:[{id:'car',name:'السيارة'},{id:'net',name:'نت وهاتف'},{id:'move',name:'تنقل'}],
  flex:[{id:'out',name:'طلعات'},{id:'clothes',name:'ملابس'},{id:'gifts',name:'هدايا'}]
});
const BUCKETS=[['goals','الأهداف'],['fun','متعة العائلة']];
const MODE_LABEL={surplus:'فايض',safe:'آمن',austerity:'ترشيد'};
const SHARE_KIND={surplus:'حصة كاملة',safe:'حصة كاملة',austerity:'حصة مرشّدة: المرن موقوف'};

const ICON={
  alert:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>',
  info:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  ok:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  lock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  up:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>',
  down:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  env:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>',
  home:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  star:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  tank:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/></svg>'
};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const fmtK=v=>{const a=Math.abs(v);if(a>=1000){const k=v/1000;return (Math.round(k*10)/10).toLocaleString('en-US')+'k';}return fmt(v);};
const sum3=o=>o.ess+o.imp+o.flex;
let uidN=1;
const uid=()=>'t'+Date.now().toString(36)+(uidN++);
const ym=m=>{const [y,mm]=m.split('-').map(Number);return {y,mm};};
const mkey=(y,mm)=>y+'-'+String(mm).padStart(2,'0');
const monthLabel=m=>{const {y,mm}=ym(m);return MONTHS[mm-1]+' '+y;};
const monthShort=m=>MONTHS[ym(m).mm-1];
const nextMonth=m=>{let {y,mm}=ym(m);mm++;if(mm>12){mm=1;y++;}return mkey(y,mm);};
const addMonths=(m,n)=>{let {y,mm}=ym(m);const t=y*12+(mm-1)+n;return mkey(Math.floor(t/12),t%12+1);};
const monthsBetween=(a,b)=>{const A=ym(a),B=ym(b);return (B.y-A.y)*12+(B.mm-A.mm);};
const thisMonth=()=>{const d=new Date();return mkey(d.getFullYear(),d.getMonth()+1);};
const inMonths=n=>n<=0?'هذا الشهر':n===1?'الشهر الجاي':n===2?'بعد شهرين':n<=10?'بعد '+n+' شهور':'بعد '+n+' شهر';
function findCat(id){const c=S.settings.cats;for(const l in c){const x=c[l].find(i=>i.id===id);if(x)return {layer:l,name:x.name};}return null;}
function catName(t){const f=findCat(t.cat);return f?f.name:(t.cname||'بند محذوف');}
function isDebtCat(id){if(id==='debt')return true;const f=findCat(id);return !!(f&&/دين|ديون|قرض|أقساط|قسط/.test(f.name));}
const layerName=id=>(LAYERS.find(l=>l.id===id)||{name:''}).name;
const bucketName=id=>(BUCKETS.find(b=>b[0]===id)||['',''])[1];
const byId=(arr,id)=>arr.find(x=>x.id===id);

/* ---------- engine: reservoir and monthly share ---------- */
function fullShare(s){return sum3(s.settings.budgets);}
function reservoir(s){let r=s.opening;for(const t of s.tx){if(t.t==='inc'||t.t==='close'||t.t==='adj')r+=t.amt;else if(t.t==='salary'||t.t==='dist'||t.t==='planned'||t.t==='debtx'||t.t==='emerg')r-=t.amt;}return r;}
function modeFor(s,res){
  const fs=fullShare(s);if(fs<=0)return 'safe';
  const c=res/fs, st=s.settings;
  if(res>st.tMax*fs)return 'surplus';
  return c>=st.brake?'safe':'austerity';
}
function plannedFor(s,mode){
  const b=s.settings.budgets;
  if(mode==='austerity')return {ess:b.ess,imp:b.imp,flex:0};
  return {ess:b.ess,imp:b.imp,flex:b.flex};
}
function monthMode(s,m){const t=s.tx.find(x=>x.t==='salary'&&x.m===m);return t?t.mode:modeFor(s,reservoir(s));}
function payShare(s){
  const res=reservoir(s), mode=modeFor(s,res), need=sum3(plannedFor(s,mode));
  const amt=Math.max(0,Math.min(need,res));
  s.tx.push({id:'sal-'+s.month,t:'salary',amt,mode,m:s.month,d:1});
  return {amt,need,mode};
}
function stats(s,m){
  const mode=monthMode(s,m), planned=plannedFor(s,mode);
  const spent={ess:0,imp:0,flex:0};let paid=0,inc=0;
  for(const t of s.tx){if(t.m!==m)continue;
    if(t.t==='exp'&&spent[t.layer]!=null)spent[t.layer]+=t.amt;
    else if(t.t==='salary')paid+=t.amt;
    else if(t.t==='inc')inc+=t.amt;}
  const spentTotal=sum3(spent);
  return {mode,planned,spent,spentTotal,paid,inc,left:paid-spentTotal};
}
function closeMonth(s){
  const st=stats(s,s.month), old=s.month;
  s.tx.push({id:'close-'+old,t:'close',amt:st.left,m:old,d:31});
  s.month=nextMonth(old);
  const pay=payShare(s);
  return {old,left:st.left,pay};
}
function goalsPool(){let g=0;for(const t of S.tx){if(t.t==='dist'&&(t.to==='goals'||t.to==='proj'))g+=t.amt;else if(t.t==='goalspend')g-=t.amt;else if(t.t==='gadj')g+=t.amt;}return g;}
function buckets(s){const b={goals:0,fun:0};for(const t of s.tx){if(t.t==='dist'){if(t.to==='fun')b.fun+=t.amt;else b.goals+=t.amt;}else if(t.t==='goalspend')b.goals-=t.amt;else if(t.t==='gadj')b.goals+=t.amt;}return b;}
const bucketsTotal=b=>b.goals+b.fun;

/* ---------- envelopes ---------- */
const weekOf=d=>Math.min(4,Math.max(1,Math.ceil((d||1)/7)));
const todayDay=()=>new Date().getDate();
function fixedActive(f){if(!f.debtId)return true;const d=byId(S.debts,f.debtId);return !!d&&debtLeft(d)>0;}
const activeFixed=()=>S.fixed.filter(fixedActive);
function fixedDone(f){return S.tx.some(t=>t.t==='exp'&&t.m===S.month&&(t.fixedId===f.id||(t.cat===f.cat&&(!f.debtId||t.debtId===f.debtId)&&!t.fixedId)));}
function weekInfo(){
  const st=stats(S,S.month), af=activeFixed(), fx=new Set(af.map(f=>f.cat));
  const fixedTotal=af.reduce((a,f)=>a+f.amt,0);
  const varBudget=Math.max(0,st.paid-fixedTotal), weekly=varBudget/4, cw=weekOf(todayDay());
  const spent=[0,0,0,0];
  for(const t of S.tx){if(t.m!==S.month||t.t!=='exp'||fx.has(t.cat))continue;spent[weekOf(t.d)-1]+=t.amt;}
  const before=spent.slice(0,cw-1).reduce((a,b)=>a+b,0), carry=weekly*(cw-1)-before;
  return {st,weekly,spent,cw,carry,left:weekly+carry-spent[cw-1],varBudget,fixedTotal,unpaid:af.filter(f=>!fixedDone(f))};
}
function wealth(){const res=reservoir(S), house=houseCash(), b=buckets(S), goals=bucketsTotal(b);return {res,house,goals,b,total:res+house+goals};}
function totalCard(){
  const w=wealth(), parts=[['house','ظرف البيت',Math.max(0,w.house),'var(--c-house)'],['res','الاحتياطي',Math.max(0,w.res),'var(--accent)'],['goal','الأهداف',Math.max(0,w.goals),'var(--c-goal)']];
  const sum=parts.reduce((a,x)=>a+x[2],0)||1;
  return `<section class="card total"><div class="row"><h2>كل فلوسكم الحين</h2><button type="button" class="link-btn" data-tab-go="env">الظروف</button></div>
    <div class="big-line"><span class="num">${fmt(w.total)}</span><span class="muted">د.ت</span></div>
    <div class="stack" role="img" aria-label="توزيع الفلوس على الظروف">${parts.filter(x=>x[2]>0).map(x=>`<span style="width:${x[2]/sum*100}%;background:${x[3]}"></span>`).join('')}</div>
    <div class="tot-rows">${parts.map((x,i)=>`<div><span class="lab"><i class="dot" style="background:${x[3]}"></i>${x[1]}</span><span class="num ${i===0&&w.house<0?'over':''}">${fmt(i===0?w.house:x[2])}</span></div>`).join('')}</div>
  </section>`;
}
function houseCash(){const st=stats(S,S.month);return st.paid-st.spentTotal;}
function ritual(){return S.ritual[S.month]||{};}

function avgSpend(s){
  const closed=[...new Set(s.tx.filter(t=>t.t==='close').map(t=>t.m))].slice(-3);
  if(!closed.length)return null;

/* ---------- engine: planning ---------- */
const planStart=p=>mkey(p.yy,p.mm);
function planPaid(p,occ){return S.tx.some(t=>t.t==='planned'&&t.planId===p.id&&t.occ===occ);}
function planNext(p){
  if(!p.yearly){const occ=planStart(p);if(planPaid(p,occ))return null;return {occ,overdue:occ<S.month};}
  const cy=ym(S.month).y;let occ=mkey(cy,p.mm);
  if(occ<S.month)occ=mkey(cy+1,p.mm);
  if(occ<planStart(p))occ=planStart(p);
  if(planPaid(p,occ))occ=mkey(ym(occ).y+1,p.mm);
  return {occ,overdue:false};
}
function dueNow(){return S.plans.map(p=>({p,n:planNext(p)})).filter(x=>x.n&&x.n.occ<=S.month);}
function plannedOutAt(K){
  let s=0;
  for(const p of S.plans){
    if(p.yearly){if(ym(K).mm===p.mm&&K>=planStart(p)&&!planPaid(p,K))s+=p.amt;}
    else if(planStart(p)===K&&!planPaid(p,K))s+=p.amt;
  }
  return s;
}
function provision(){
  let yearly=0,once=0;const end=addMonths(S.month,11);
  for(const p of S.plans){
    if(p.yearly)yearly+=p.amt/12;
    else{const n=planNext(p);if(n&&n.occ<=end)once+=p.amt/12;}
  }
  return {yearly,once,total:yearly+once};
}
function goalAlloc(){
  let avail=Math.max(0,goalsPool());const m={};
  for(const g of S.goals){if(g.done)continue;const a=Math.max(0,Math.min(g.target,avail));m[g.id]=a;avail-=a;}
  return {m,free:Math.max(0,avail)};
}
function goalsMonthlyNeed(){
  const al=goalAlloc().m;let need=0;
  for(const g of S.goals){if(g.done||!g.yy)continue;const left=Math.max(0,g.target-(al[g.id]||0));if(!left)continue;need+=left/Math.max(1,monthsBetween(S.month,mkey(g.yy,g.mm)));}
  return need;
}
function debtPaid(d){let p=0;for(const t of S.tx)if(t.debtId===d.id&&(t.t==='exp'||t.t==='debtx'))p+=t.amt;return p;}
const debtLeft=d=>Math.max(0,d.amount-debtPaid(d));
function incomeHistory(){
  const months=[...new Set(S.tx.map(t=>t.m))].sort().slice(-6);
  const tot=S.tx.filter(t=>t.t==='inc'&&months.includes(t.m)).reduce((a,t)=>a+t.amt,0);
  return {avg:months.length?tot/months.length:0,n:months.length};
}
function expectedIncome(){return S.settings.expectedIncome>0?S.settings.expectedIncome:Math.round(incomeHistory().avg);}

// Month-by-month projection using the same rules the app applies: share by mode, planned outflows, income, surplus distributed above the max target.
function simulate(income,n){
  const fs=fullShare(S), st=S.settings;let res=reservoir(S);
  res-=dueNow().reduce((a,x)=>a+x.p.amt,0);
  const pts=[{m:S.month,res,mode:modeFor(S,res),short:0,out:0,goalsIn:0}];let goalsIn=0,m=S.month;
  for(let k=1;k<=n;k++){
    m=nextMonth(m);
    const mode=modeFor(S,res), need=sum3(plannedFor(S,mode)), paid=Math.max(0,Math.min(need,res));
    res-=paid;const out=plannedOutAt(m);res-=out;res+=income;
    const cap=st.tMax*fs;if(fs>0&&res>cap){goalsIn+=(res-cap)*st.split.goals/100;res=cap;}
    pts.push({m,res,mode,short:need-paid,out,goalsIn});
  }
  return pts;
}
function dryRun(){
  const pts=simulate(0,36);
  const firstShort=pts.find((p,i)=>i>0&&p.short>0.5);
  const firstAust=pts.find((p,i)=>i>0&&p.mode==='austerity');
  const lastFull=firstAust?addMonths(firstAust.m,-1):firstShort?addMonths(firstShort.m,-1):null;
  return {firstShort,firstAust,lastFull};
}

function normalize(s){

  if(!s.settings.cats||!Array.isArray(s.plans)){if(s.isSample)return null;s.settings.cats=s.settings.cats||DEFAULT_CATS();s.plans=s.plans||[];s.goals=s.goals||[];s.debts=s.debts||[];}

let syncState='ok', pushing=false, pushAgain=false, pushTimer=null, pulling=false, pendingRender=false;

  const r=await fetch(API,{method,headers:{'content-type':'application/json',authorization:'Bearer '+(pass||getPass())},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e;}

const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
function snapshot(doc){const cfg={};for(const k of CFG_KEYS)cfg[k]=JSON.stringify((doc.cfg||{})[k]??null);return {rev:doc.rev||0,ids:(doc.tx||[]).map(t=>t.id),cfg};}
function diff(){
  const b=new Set(base.ids), cur=new Set(S.tx.map(t=>t.id));
  const add=S.tx.filter(t=>!b.has(t.id)), del=base.ids.filter(id=>!cur.has(id)), cfg={};
  for(const k of CFG_KEYS){const v=JSON.stringify(S[k]??null);if(v!==base.cfg[k])cfg[k]=S[k]??null;}
  return {add,del,cfg,empty:!add.length&&!del.length&&!Object.keys(cfg).length};
}
// Combine the server copy with anything changed on this phone that the server has not seen yet.
function mergeFromServer(doc){
  const hasCfg=doc.cfg&&doc.cfg.settings;
  if(!base){
    if(hasCfg){const n=normalize(Object.assign({},clone(doc.cfg),{tx:clone(doc.tx)}));if(n)S=n;base=snapshot(doc);}
    else base=snapshot({rev:doc.rev||0,tx:doc.tx||[],cfg:{}});
    return;
  }
  if((doc.rev||0)<base.rev)return;   // an older answer that arrived late
  const old=base, oldIds=new Set(old.ids), cur=new Set(S.tx.map(t=>t.id)), docIds=new Set(doc.tx.map(t=>t.id));
  const deletedHere=new Set(old.ids.filter(id=>!cur.has(id)));
  const newHere=S.tx.filter(t=>!oldIds.has(t.id)&&!docIds.has(t.id));
  const next={tx:clone(doc.tx).filter(t=>!deletedHere.has(t.id)).concat(newHere)};
  for(const k of CFG_KEYS){const local=JSON.stringify(S[k]??null);next[k]=local!==old.cfg[k]?S[k]:clone((doc.cfg||{})[k]);}
  const n=normalize(next);if(n)S=n;
  base=snapshot(doc);
}
function schedulePush(){if(!LIVE)return;clearTimeout(pushTimer);pushTimer=setTimeout(push,600);setSync('pending');}
async function push(){
  if(!LIVE||!getPass()||!base)return;
  if(pushing){pushAgain=true;return;}
  const d=diff();if(d.empty){setSync('ok');return;}
  pushing=true;setSync('saving');
  try{const doc=await api('POST',{add:d.add,del:d.del,cfg:d.cfg});mergeFromServer(doc);persistLocal();refreshUI();}
  catch(e){pushing=false;if(e.status===401){setSync('auth');showGate();return;}setSync(e.status===409?'saving':'offline');clearTimeout(pushTimer);pushTimer=setTimeout(push,e.status===409?800:15000);return;}
  pushing=false;
  if(pushAgain||!diff().empty){pushAgain=false;push();}else setSync('ok');
}
async function pull(){
  if(!LIVE||!getPass()||pulling||pushing)return;
  pulling=true;
  try{
    const doc=await api('GET');
    if(!base||doc.rev>base.rev){mergeFromServer(doc);persistLocal();refreshUI();}
    catchUp();
    if(!diff().empty)schedulePush();else if(syncState!=='pending')setSync('ok');
  }catch(e){if(e.status===401){setSync('auth');showGate();}else setSync('offline');}
  pulling=false;
}

}

  const recent=S.tx.filter(t=>t.t==='exp'||t.t==='inc').slice(-4).reverse();
  h+=`<section style="display:flex;flex-direction:column;gap:8px"><div class="row" style="padding:0 4px"><h2 style="font-size:15px">آخر العمليات</h2><button type="button" class="link-btn" data-tab-go="tx">الكل</button></div>

/* ---------- transactions ---------- */
function txView(){

      <ul class="txlist">${list.slice().reverse().map(t=>txRow(t,true)).join('')}</ul>`;

/* ---------- plan ---------- */
function niceStep(range){const raw=range/4;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function chartSVG(series,fs){
  const st=S.settings, W=360, H=210, ml=40, mr=58, mt=10, mb=24, pw=W-ml-mr, ph=H-mt-mb;
  let lo=0, hi=st.tMax*fs*1.08;
  series.forEach(s=>s.pts.forEach(p=>{lo=Math.min(lo,p.res);hi=Math.max(hi,p.res);}));
  const step=niceStep(hi-lo);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const n=series[0].pts.length-1, x=i=>ml+i*pw/n, y=v=>mt+(hi-v)/(hi-lo)*ph;
  let g='';
  // bands
  const bTop=y(Math.min(hi,st.tMax*fs)), bBot=y(Math.max(lo,st.brake*fs));
  g+=`<rect class="band-safe" x="${ml}" y="${bTop}" width="${pw}" height="${Math.max(0,bBot-bTop)}"/>`;
  g+=`<text class="band-lab" x="${ml+4}" y="${bTop+11}" text-anchor="start">منطقة الأمان</text>`;
  const lTop=y(Math.min(hi,st.brake*fs)), lBot=y(Math.max(lo,0));
  g+=`<rect class="band-low" x="${ml}" y="${lTop}" width="${pw}" height="${Math.max(0,lBot-lTop)}"/>`;
  g+=`<text class="band-lab" x="${ml+4}" y="${lBot-4}" text-anchor="start">ترشيد</text>`;
  // grid + y labels
  for(let v=lo;v<=hi+0.1;v+=step){g+=`<line class="gridl" x1="${ml}" x2="${ml+pw}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${ml-6}" y="${y(v)+3}" text-anchor="end">${fmtK(v)}</text>`;}
  // x labels
  series[0].pts.forEach((p,i)=>{if(i%3===0)g+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${i===0?'الآن':monthShort(p.m)}</text>`;});
  // lines
  series.forEach(s=>{g+=`<path class="ln ${s.cls}" d="${s.pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.res).toFixed(1)).join(' ')}"/>`;});
  // end labels, pushed apart to avoid overlap
  const ends=series.map(s=>({cls:s.cls,v:s.pts[n].res,yy:y(s.pts[n].res)})).sort((a,b)=>a.yy-b.yy);
  for(let i=1;i<ends.length;i++)if(ends[i].yy-ends[i-1].yy<13)ends[i].yy=ends[i-1].yy+13;
  ends.forEach(e=>{g+=`<circle cx="${x(n)}" cy="${y(e.v)}" r="3.5" style="fill:var(--c-${e.cls});stroke:var(--surface);stroke-width:2"/><text class="endlab" x="${x(n)+8}" y="${e.yy+3.5}" text-anchor="start">${fmtK(e.v)}</text>`;});
  g+=`<line id="cross" class="cross" x1="0" x2="0" y1="${mt}" y2="${mt+ph}" visibility="hidden"/>`;
  g+=`<rect id="hit" x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="transparent"/>`;
  chartData={series,ml,pw,n,W};
  return `<svg viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="توقّع رصيد الاحتياطي لـ ${n} شهر بثلاث حالات للإيراد">${g}</svg>`;
}
function bindChart(){
  const wrap=$('#chartWrap');if(!wrap||!chartData)return;
  const svg=wrap.querySelector('svg'), tip=$('#chartTip'), cross=svg.querySelector('#cross');
  const show=ev=>{
    const r=svg.getBoundingClientRect(), sx=(ev.clientX-r.left)/r.width*chartData.W;
    const i=Math.max(0,Math.min(chartData.n,Math.round((sx-chartData.ml)/chartData.pw*chartData.n)));
    const px=chartData.ml+i*chartData.pw/chartData.n;
    cross.setAttribute('x1',px);cross.setAttribute('x2',px);cross.setAttribute('visibility','visible');
    const p0=chartData.series[0].pts[i];
    tip.innerHTML=`<b>${i===0?'الآن':monthLabel(p0.m)}</b>`+chartData.series.map(s=>`<div class="t-row"><span><i style="background:var(--c-${s.cls})"></i>${s.short}</span><span class="num">${fmt(s.pts[i].res)}</span></div>`).join('')+(p0.out?`<div class="t-row"><span>التزامات</span><span class="num">-${fmt(p0.out)}</span></div>`:'');
    tip.hidden=false;
    const left=px/chartData.W*r.width, tw=tip.offsetWidth;
    tip.style.left=Math.max(0,Math.min(r.width-tw,left-tw/2))+'px';
  };
  const hide=()=>{tip.hidden=true;cross.setAttribute('visibility','hidden');};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',hide);
}

function planView(){
  const set=S.settings, fs=fullShare(S), res=reservoir(S), hist=incomeHistory(), exp=expectedIncome();
  const prov=provision(), gNeed=goalsMonthlyNeed();
  const gIncome=gNeed>0&&set.split.goals>0?gNeed*100/set.split.goals:0;
  const required=fs+prov.total+gIncome, gap=exp-required;
  let h=header('الخطة المالية');

  // 1. what income the plan needs
  h+=`<section class="card"><h2>الإيراد اللي تحتاجه الخطة شهرياً</h2>
    <div class="need-big"><span class="num">${fmt(required)}</span><span class="muted">د.ت بالمتوسط</span></div>
    <div class="breakdown">
      <div class="row"><span>حصة البيت</span><span class="num">${fmt(fs)}</span></div>
      ${prov.total>0?`<div class="row"><span>مخصص الالتزامات القادمة <span class="muted small">(÷12)</span></span><span class="num">${fmt(prov.total)}</span></div>`:''}
      ${gIncome>0?`<div class="row"><span>الأهداف في وقتها <span class="muted small">(من الفايض)</span></span><span class="num">${fmt(gIncome)}</span></div>`:''}
      <div class="row total"><span>متوسط إيرادكم ${set.expectedIncome>0?'(اللي حددتوه)':hist.n?`(آخر ${hist.n} ${hist.n===1?'شهر':'شهور'})`:''}</span><span class="num">${fmt(exp)}</span></div>
    </div>
    ${exp<=0?`<div class="banner info">${ICON.info}<p>ما فيه إيراد مسجّل بعد. سجّلوا إيراداتكم أو اكتبوا الإيراد المتوقع تحت عشان تكتمل المقارنة.</p></div>`
      :gap>=0?`<div class="banner info">${ICON.ok}<div><b>إيرادكم يغطي الخطة</b><p>يزيد ${fmt(gap)} د.ت شهرياً بالمتوسط. الزايد يعبّي الاحتياطي ثم يتوزع فايض.</p></div></div>`
      :`<div class="banner warn">${ICON.alert}<div><b>ناقص ${fmt(-gap)} د.ت شهرياً</b><p>الخيارات: خفّضوا حصة البيت، أجّلوا هدف، أو مدّوا موعد الالتزامات. وإلا الاحتياطي بينزل مع الوقت.</p></div></div>`}
  </section>`;

  // 2. dry-month test
  const d=dryRun();
  h+=`<section class="card"><h2>اختبار الشهور الجافة</h2><p class="small muted">لو ما دخل ولا دينار من الحين، مع الالتزامات المخططة:</p>
    <ul class="dry">
      <li><span>الحصة الكاملة مضمونة حتى</span><b>${d.lastFull?monthLabel(d.lastFull):'أكثر من 3 سنين'}</b></li>
      <li><span>الترشيد يبدأ في</span><b>${d.firstAust?monthLabel(d.firstAust.m):'ما يبدأ خلال 3 سنين'}</b></li>
      <li><span>الاحتياطي ما يكفي الحصة في</span><b class="${d.firstShort?'over':''}">${d.firstShort?monthLabel(d.firstShort.m):'ما يصير خلال 3 سنين'}</b></li>
    </ul></section>`;

  // 3. projection
  const N=12, sExp=simulate(exp,N), sCons=simulate(Math.round(exp/2),N), sNone=simulate(0,N);
  const series=[{cls:'exp',name:'بالمتوسط',short:'المتوسط',pts:sExp},{cls:'cons',name:'متحفظ: نص المتوسط',short:'متحفظ',pts:sCons},{cls:'none',name:'بدون إيراد',short:'بدون',pts:sNone}];
  h+=`<section class="card"><h2>توقّع الاحتياطي لـ 12 شهر</h2>
    <div class="chart-legend">${series.map(s=>`<span><i class="sw ${s.cls}"></i>${s.name}${s.cls!=='none'?` <span class="num">(${fmt(s.cls==='exp'?exp:Math.round(exp/2))})</span>`:''}</span>`).join('')}</div>
    <div class="chart-wrap" id="chartWrap" dir="ltr">${chartSVG(series,fs)}<div class="tip" id="chartTip" dir="rtl" hidden></div></div>
    <p class="hint">المسار يطبّق نفس القواعد: ترشيد تحت ${set.brake} شهر، والفايض فوق ${set.tMax} شهور يتوزع. المس الرسم وشوف أي شهر.</p>
    <div class="field"><label for="expInc">الإيراد المتوقع شهرياً (فاضي = متوسطكم الفعلي)</label><input class="num" id="expInc" data-set="expected" type="number" inputmode="numeric" min="0" step="100" value="${set.expectedIncome||''}" placeholder="${fmt(hist.avg)}"></div>
    <details class="more"><summary>عرض كجدول</summary><div class="table-wrap"><table><thead><tr><th>الشهر</th>${series.map(s=>`<th>${s.short}</th>`).join('')}<th>التزامات</th></tr></thead><tbody>
      ${sExp.map((p,i)=>`<tr><td>${i===0?'الآن':monthLabel(p.m)}</td>${series.map(s=>`<td class="num">${fmt(s.pts[i].res)}</td>`).join('')}<td class="num">${p.out?'-'+fmt(p.out):''}</td></tr>`).join('')}
    </tbody></table></div></details>
  </section>`;

  // 4. planned obligations
  const plans=S.plans.map(p=>({p,n:planNext(p)})).filter(x=>x.n).sort((a,b)=>a.n.occ<b.n.occ?-1:1);
  const done=S.plans.filter(p=>!planNext(p));

    ${plans.length?plans.map(({p,n})=>{const mo=monthsBetween(S.month,n.occ);return `<div class="item"><div class="row top-align"><div style="min-width:0"><div class="name">${esc(p.name)}</div>
      <div class="meta">${p.yearly?'كل سنة في '+MONTHS[p.mm-1]:'مرة وحدة: '+monthLabel(planStart(p))} · ${n.overdue?'<span class="over">متأخر</span>':inMonths(mo)}</div></div>
      <div class="item-actions"><span class="amt">${fmt(p.amt)}</span><button type="button" class="icon-btn" data-action="del-plan" data-id="${p.id}" aria-label="حذف ${esc(p.name)}">${ICON.trash}</button></div></div></div>`;}).join('')

    ${done.length?`<p class="hint">انتهت: ${done.map(p=>esc(p.name)).join('، ')}</p>`:''}
    <details class="adder"><summary>+ إضافة التزام</summary><div class="adder-body">
      <div class="field"><label for="np-name">الاسم</label><input id="np-name" type="text" placeholder="مثلاً: رسوم المدرسة" maxlength="30"></div>
      <div class="fields"><div class="field"><label for="np-amt">المبلغ</label><input class="num" id="np-amt" type="number" inputmode="numeric" min="0" step="50"></div>
        <div class="field"><label for="np-mm">الشهر</label><select id="np-mm">${monthOptions(ym(nextMonth(S.month)).mm)}</select></div>
        <div class="field"><label for="np-yy">السنة</label><select id="np-yy">${yearOptions(ym(nextMonth(S.month)).y)}</select></div></div>
      <label class="check"><input type="checkbox" id="np-yearly" checked> يتكرر كل سنة</label>
      <p class="form-error" id="np-err" role="alert"></p>
      <button type="button" class="btn" data-action="add-plan">إضافة</button></div></details>
  </section>`;

  // 5. goals
  const al=goalAlloc(), pool=goalsPool(), active=S.goals.filter(g=>!g.done), doneGoals=S.goals.filter(g=>g.done);
  const sGoal=simulate(exp,48);let cum=0;
  const eta={};for(const g of active){cum+=g.target;const needIn=cum-Math.max(0,pool);if(needIn<=0){eta[g.id]=S.month;continue;}const hit=sGoal.find(p=>p.goalsIn>=needIn);eta[g.id]=hit?hit.m:null;}
  h+=`<div class="section-title"><h2>الأهداف</h2><span class="small muted">في الصندوق <span class="num">${fmt(pool)}</span></span></div>
  <section class="card"><p class="hint">للأشياء الكبيرة اللي تنجمع على وقت: مقدّم سيارة، بيت، تعليم. تتعبّى من الفايض بالترتيب، الأول يكمل قبل اللي بعده. والمصاريف اللي تتكرر كل سنة، مثل السفرة والعيد، حطوها في الالتزامات.</p>
    ${active.length?active.map((g,i)=>{const a=al.m[g.id]||0, pct=g.target?Math.min(100,a/g.target*100):0, due=g.yy?mkey(g.yy,g.mm):null, e=eta[g.id];
      const late=due&&(!e||e>due), monthsLeft=due?Math.max(1,monthsBetween(S.month,due)):0, perMonth=due?Math.max(0,g.target-a)/monthsLeft:0;
      return `<div class="item"><div class="row top-align"><div style="min-width:0"><div class="name">${esc(g.name)}</div>
        <div class="meta">${due?'الموعد: '+monthLabel(due)+' · يحتاج '+fmt(perMonth)+' شهرياً':'بدون موعد'}</div></div>
        <span class="amt">${fmt(a)} <span class="muted small">/ ${fmt(g.target)}</span></span></div>
        <div class="bar"><div style="width:${pct}%;background:var(--c-goal)"></div></div>
        <div class="row"><span class="small">${a>=g.target?'<span class="tag ok">جاهز</span>':e?`<span class="muted">بالمتوسط توصلون له: </span><b class="num">${monthLabel(e)}</b> ${due?(late?'<span class="tag bad">بعد الموعد</span>':'<span class="tag ok">قبل الموعد</span>'):''}`:'<span class="tag bad">ما يتحقق خلال 4 سنين بالمتوسط</span>'}</span>
          <span class="item-actions">
            <button type="button" class="icon-btn" data-action="goal-up" data-id="${g.id}" aria-label="ارفع الأولوية" ${i===0?'disabled':''}>${ICON.up}</button>
            <button type="button" class="icon-btn" data-action="goal-down" data-id="${g.id}" aria-label="نزّل الأولوية" ${i===active.length-1?'disabled':''}>${ICON.down}</button>
            <button type="button" class="icon-btn" data-action="del-goal" data-id="${g.id}" aria-label="حذف ${esc(g.name)}">${ICON.trash}</button></span></div>
        ${a>=g.target?`<button type="button" class="btn small" data-action="goal-done" data-id="${g.id}">حققناه: اصرف ${fmt(g.target)} من الصندوق</button>`:''}
      </div>`;}).join('')
      :`<p class="empty">ما فيه أهداف. أضيفوا أول هدف تحت.</p>`}
    ${doneGoals.length?`<p class="hint">تحققت: ${doneGoals.map(g=>esc(g.name)).join('، ')}</p>`:''}
    <details class="adder"><summary>تحويل يدوي من الاحتياطي للأهداف</summary><div class="adder-body">
      <p class="hint">استخدموه بحذر: كل دينار تحوّلونه ينقص من أمان الاحتياطي. حالياً يغطي ${fs?(res/fs).toFixed(1):0} شهر.</p>
      <div class="add-cat"><input class="num" id="gt-amt" type="number" inputmode="numeric" min="0" step="100" placeholder="المبلغ" aria-label="مبلغ التحويل"><button type="button" class="btn small" data-action="goal-transfer">حوّل</button></div></div></details>
    <details class="adder"><summary>+ إضافة هدف</summary><div class="adder-body">
      <div class="field"><label for="ng-name">الهدف</label><input id="ng-name" type="text" placeholder="مثلاً: مقدّم سيارة" maxlength="30"></div>
      <div class="fields"><div class="field"><label for="ng-amt">المبلغ</label><input class="num" id="ng-amt" type="number" inputmode="numeric" min="0" step="100"></div>
        <div class="field"><label for="ng-mm">شهر الموعد</label><select id="ng-mm"><option value="0">بدون</option>${monthOptions(0)}</select></div>
        <div class="field"><label for="ng-yy">السنة</label><select id="ng-yy">${yearOptions(ym(S.month).y+1)}</select></div></div>
      <p class="form-error" id="ng-err" role="alert"></p>
      <button type="button" class="btn" data-action="add-goal">إضافة</button></div></details>
  </section>`;

  // 6. debts
  const debts=S.debts.map(dd=>({d:dd,left:debtLeft(dd)})).sort((a,b)=>(a.left===0)-(b.left===0)||a.left-b.left);
  const totalLeft=debts.reduce((a,x)=>a+x.left,0), totalInst=debts.filter(x=>x.left>0).reduce((a,x)=>a+x.d.inst,0);
  const freeMonth=debts.filter(x=>x.left>0).reduce((m,x)=>{const k=addMonths(S.month,Math.ceil(x.left/Math.max(1,x.d.inst)));return k>m?k:m;},'');
  h+=`<div class="section-title"><h2>الديون</h2>${totalLeft>0?`<span class="small muted">باقي <span class="num">${fmt(totalLeft)}</span></span>`:''}</div>
  <section class="card">
    ${totalLeft>0?`<div class="row small"><span class="muted">أقساط شهرية <span class="num">${fmt(totalInst)}</span> من حصة الأساسي</span><span>بدون ديون في <b class="num">${monthLabel(freeMonth)}</b></span></div>
      <p class="hint">مرتّبة من الأصغر. لما يجيكم فايض، سدّدوا الأصغر أول عشان يتحرر قسطه بسرعة.</p>`:''}
    ${debts.length?debts.map(({d:dd,left})=>{const paid=dd.amount-left, pct=dd.amount?Math.min(100,paid/dd.amount*100):0, months=left>0?Math.ceil(left/Math.max(1,dd.inst)):0;
      return `<div class="item"><div class="row top-align"><div style="min-width:0"><div class="name">${esc(dd.name)}</div>
        <div class="meta">${left>0?'قسط '+fmt(dd.inst)+' · يخلص '+monthLabel(addMonths(S.month,months)):'<span class="tag ok">انتهى</span> تحرر قسط '+fmt(dd.inst)+' شهرياً. خفّضوا حصة الأساسي أو خلّوه يروح للفايض.'}</div></div>
        <span class="amt">${fmt(left)} <span class="muted small">باقي</span></span></div>
        <div class="bar"><div style="width:${pct}%;background:var(--pos)"></div></div>
        <div class="row"><span class="small muted">سدّدتوا ${fmt(paid)} من ${fmt(dd.amount)}</span>
          <button type="button" class="icon-btn" data-action="del-debt" data-id="${dd.id}" aria-label="حذف ${esc(dd.name)}">${ICON.trash}</button></div>
        ${left>0?`<div class="btn-row">${S.tx.some(t=>t.t==='exp'&&t.m===S.month&&t.debtId===dd.id)?'<span class="tag ok" style="align-self:center">قسط الشهر مسجّل</span>':`<button type="button" class="btn small" data-action="debt-inst" data-id="${dd.id}">سجّل قسط الشهر</button>`}<button type="button" class="btn small ghost" data-action="debt-extra" data-id="${dd.id}">قسط إضافي من الاحتياطي</button></div>`:''}
      </div>`;}).join('')
      :`<p class="empty">ما فيه ديون مسجّلة.</p>`}
    <details class="adder"><summary>+ إضافة دين</summary><div class="adder-body">
      <div class="field"><label for="nd-name">الاسم</label><input id="nd-name" type="text" placeholder="مثلاً: قرض البنك" maxlength="30"></div>
      <div class="fields two"><div class="field"><label for="nd-amt">المبلغ الباقي</label><input class="num" id="nd-amt" type="number" inputmode="numeric" min="0" step="100"></div>
        <div class="field"><label for="nd-inst">القسط الشهري</label><input class="num" id="nd-inst" type="number" inputmode="numeric" min="0" step="50"></div></div>
      <p class="form-error" id="nd-err" role="alert"></p>
      <button type="button" class="btn" data-action="add-debt">إضافة</button></div></details>
  </section>`;
  return h;
}

/* ---------- envelopes ---------- */
const ICON_TANK20='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>';
function step(n,done,title,body){return `<li class="step ${done?'done':''}"><span class="mark">${done?ICON.ok:n}</span><div class="txt"><b>${title}</b>${body}</div></li>`;}
function envView(){
  const res=reservoir(S), fs=fullShare(S), set=S.settings, sur=surplusOf(S), b=buckets(S), wi=weekInfo(), st=wi.st;
  const plannedTotal=sum3(st.planned), hc=houseCash(), goalsTotal=bucketsTotal(b), cashCap=fs, r=ritual(), due=dueNow();
  let h=header('الظروف');

  h+=`<section class="card total" style="padding-bottom:12px"><div class="row"><h2>المجموع في كل الظروف</h2><span class="num" style="font-size:22px;font-weight:600">${fmt(res+hc+goalsTotal)} <span class="muted small">د.ت</span></span></div></section>`;
  h+=`<section class="envs" aria-label="الظروف">
    <div class="env house ${hc<0?'warn':''}"><span class="ico">${ICON.home}</span><div class="body"><b>ظرف البيت</b><span>الباقي من حصة ${monthShort(S.month)}</span></div><span class="amt ${hc<0?'over':''}">${fmt(hc)}</span></div>
    <div class="env"><span class="ico">${ICON_TANK20}</span><div class="body"><b>ظرف الاحتياطي</b><span>${res>cashCap?`${fmt(cashCap)} كاش · ${fmt(res-cashCap)} في حساب الادخار`:'كله كاش في الظرف'}</span></div><span class="amt">${fmt(res)}</span></div>
    <div class="env goal"><span class="ico">${ICON.star}</span><div class="body"><b>ظرف الأهداف</b><span>${goalsTotal>0?`أهداف ${fmt(b.goals)} · متعة ${fmt(b.fun)}`:'يتعبّى من الفايض'}</span></div><span class="amt">${fmt(goalsTotal)}</span></div>
  </section>`;

  h+=`<section class="card"><h2>ظروف الأسابيع</h2>
    <p class="small muted">${st.paid>0?`حصة الشهر ${fmt(st.paid)}، ناقص الثابتة ${fmt(wi.fixedTotal)}، يبقى ${fmt(wi.varBudget)} للمصروف المتغير: <b class="num" style="color:var(--fg)">${fmt(wi.weekly)}</b> لكل أسبوع.`:'حصة الشهر ما انتقلت لظرف البيت بعد.'}</p>
    ${weekHeadline(wi)}${weeksStrip(wi)}
    <p class="hint">الأسبوع الأول من 1 لـ 7، والرابع من 22 لآخر الشهر. الوفر ينتقل للأسبوع اللي بعده تلقائياً.</p></section>`;

  const s1=st.paid>=plannedTotal-0.5, s2=!wi.unpaid.length, s3=!!r.split;
  const unpaidSum=wi.unpaid.reduce((a,f)=>a+f.amt,0);
  h+=`<section class="card"><h2>روتين أول الشهر</h2><ol class="steps">
    ${step(1,s1,'انقلوا حصة الشهر لظرف البيت',`<p>${fmt(plannedTotal)} د.ت من ظرف الاحتياطي${st.mode==='austerity'?' (حصة مرشّدة هالشهر)':''}.</p>${!s1&&res>0?`<button type="button" class="btn small" data-action="topup">نقلناها: سجّل ${fmt(Math.min(plannedTotal-st.paid,res))}</button>`:''}`)}
    ${step(2,s2&&S.fixed.length>0,'ادفعوا المصاريف الثابتة',S.fixed.length?(s2?`<p>كلها مدفوعة هالشهر.</p>`:`<p>${wi.unpaid.map(f=>esc((findCat(f.cat)||{name:'بند'}).name)+' '+fmt(f.amt)).join('، ')}</p><button type="button" class="btn small" data-action="pay-fixed">دفعناها: سجّلها (${fmt(unpaidSum)})</button>`):`<p>ما حددتوا مصاريف ثابتة. <button type="button" class="link-btn" style="padding:0" data-tab-go="set">أضيفوها من الإعدادات</button></p>`)}
    ${step(3,s3,'قسّموا الباقي على 4 أظرف أسبوعية',`<p>${fmt(wi.weekly)} د.ت في كل ظرف.</p><button type="button" class="btn small ${s3?'ghost':''}" data-action="ritual-split">${s3?'تراجع':'قسّمناها'}</button>`)}
    ${due.length?step(4,false,'ادفعوا الالتزامات المستحقة من ظرف الاحتياطي',due.map(x=>`<div class="row"><span class="small">${esc(x.p.name)}${x.n.overdue?' <span class="over">متأخر</span>':''}</span><button type="button" class="btn small" data-action="pay-plan" data-id="${x.p.id}" data-occ="${x.n.occ}">ادفع ${fmt(x.p.amt)}</button></div>`).join('')):''}
  </ol></section>`;

  if(sur>0){
    const rows=BUCKETS.map(([k,n])=>{const a=Math.round(sur*set.split[k]/100);return `<div class="alloc"><div class="row small"><span>${n}</span><span><span class="muted">${set.split[k]}٪</span> <b class="num">${fmt(a)}</b></span></div><div class="bar"><div style="width:${set.split[k]}%;background:var(--accent)"></div></div></div>`;}).join('');
    h+=`<section class="card"><h2>الاحتياطي فاض: <span class="num">${fmt(sur)}</span> د.ت</h2>${rows}<button type="button" class="btn block" data-action="distribute">وزّع الفايض</button><p class="hint">انقلوا المبالغ من ظرف الاحتياطي لظرف الأهداف، وبعدها اضغطوا وزّع.</p></section>`;
  }

  const counted=S.lastCount&&S.lastCount.m===S.month;
  h+=`<section class="card"><h2>روتين آخر الشهر</h2><ol class="steps">
    ${step(1,false,'رجّعوا باقي ظرف البيت لظرف الاحتياطي',hc>=0?`<p>${fmt(hc)} د.ت. يتسجل تلقائي لما تقفلون الشهر.</p>`:`<p class="over">تجاوزتوا ${fmt(-hc)} د.ت، وبينخصم من الاحتياطي.</p>`)}
    ${step(2,counted,'عدّوا الظروف وقارنوها',`<p>من الجرد تحت.</p>`)}
    ${LIVE?step(3,false,'الشهر يتقفل لحاله',`<p>أول يوم في ${monthLabel(nextMonth(S.month))} يرجع الباقي للاحتياطي وتنزل الحصة الجديدة تلقائياً.</p>`):step(3,false,'اقفلوا الشهر',`<button type="button" class="btn small ghost" data-action="advance">اقفل ${monthShort(S.month)} وابدأ ${monthLabel(nextMonth(S.month))}</button>`)}
  </ol></section>`;

  const c=ui.count||{vals:{}}, v=c.vals;
  const fld=(id,lab)=>`<div class="field"><label for="${id}">${lab}</label><input class="num" id="${id}" data-count="${id}" type="number" inputmode="decimal" min="0" value="${v[id]!=null?v[id]:''}"></div>`;
  let results='';
  if(c.rows){
    results=`<div class="count-res">${c.rows.map(rw=>{
      if(Math.abs(rw.diff)<0.5)return `<div class="count-row ok"><span>${rw.label}: مطابق</span>${ICON.ok}</div>`;
      const msg=rw.key==='house'?(rw.diff<0?`ناقص ${fmt(-rw.diff)}: غالباً مصروف ما تسجّل`:`زايد ${fmt(rw.diff)}: يمكن مصروف تسجّل مرتين`):`${rw.diff<0?'ناقص':'زايد'} ${fmt(Math.abs(rw.diff))} عن المسجّل`;
      const fixLab=rw.key==='house'&&rw.diff<0?'سجّله مصروف':'اعتمد المعدود';
      return `<div class="count-row off"><span>${rw.label}: ${msg}</span><button type="button" class="btn small ghost" data-action="count-fix" data-key="${rw.key}">${fixLab}</button></div>`;}).join('')}
      ${c.tooMuchCash>0?`<div class="banner info">${ICON.info}<p>الكاش في ظرف الاحتياطي فوق حصة شهر. حطوا ${fmt(c.tooMuchCash)} في حساب الادخار.</p></div>`:''}</div>`;
  }
  h+=`<section class="card"><h2>جرد الظروف</h2><p class="hint">عدّوا الكاش واكتبوا رصيد الحسابات. اللي ما تعدّونه خلوه فاضي.</p>
    <div class="fields two">${fld('c-house','كاش في ظرف البيت')}${fld('c-rcash','كاش في ظرف الاحتياطي')}${fld('c-rbank','حساب الادخار (الاحتياطي)')}${fld('c-goals','الأهداف (ظرف أو حساب)')}</div>
    <button type="button" class="btn" data-action="count">قارن بالمسجّل</button>${results}
    ${S.lastCount?`<p class="hint">آخر جرد: ${S.lastCount.d} ${monthLabel(S.lastCount.m)}</p>`:''}</section>`;

  h+=`<section class="card"><h2>قواعدنا</h2><ol class="rules">
    <li>أي إيراد يدخل ظرف الاحتياطي أول، قبل ما ينصرف منه شي.</li>
    <li>ظرف الاحتياطي ما ينفتح إلا لثلاث: حصة الشهر، الالتزامات المخططة، والطوارئ الحقيقية.</li>
    <li>مصاريف الشهر كلها من ظرف البيت بس.</li>
    <li>الثابتة تندفع أول الشهر، والباقي يتقسم على 4 أظرف أسبوعية.</li>
    <li>خلص ظرف الأسبوع؟ خذوا من ظرف الأسبوع الجاي، مو من الاحتياطي.</li>
    <li>آخر الشهر: باقي ظرف البيت يرجع للاحتياطي، ونعدّ الظروف.</li>
    <li>الكاش في البيت ما يتعدى حصة شهر. الباقي في حساب ادخار.</li>
    <li>كل عملية تتسجل في نفس اليوم، من اللي صرفها.</li>
  </ol></section>`;

  const months=[...new Set(S.tx.map(t=>t.m))].sort();
  let run=S.opening, rows='';
  for(const m of months){
    let inc=0,sal=0,close=0,dist=0,obl=0;
    for(const t of S.tx){if(t.m!==m)continue;if(t.t==='inc')inc+=t.amt;else if(t.t==='salary')sal+=t.amt;else if(t.t==='close')close+=t.amt;else if(t.t==='dist')dist+=t.amt;else if(t.t==='planned'||t.t==='debtx'||t.t==='emerg')obl+=t.amt;else if(t.t==='adj')obl-=t.amt;}
    run=run+inc-sal+close-dist-obl;
    rows+=`<tr><td>${monthShort(m)}</td><td class="num">+${fmt(inc)}</td><td class="num">-${fmt(sal)}</td><td class="num">${close>=0?'+':''}${fmt(close)}</td><td class="num">${obl?(obl>0?'-':'+')+fmt(Math.abs(obl)):''}</td><td class="num">${dist?'-'+fmt(dist):''}</td><td class="num"><b>${fmt(run)}</b></td></tr>`;
  }
  h+=`<section class="card"><details class="more"><summary>حركة ظرف الاحتياطي شهر بشهر</summary><div class="table-wrap"><table><thead><tr><th>الشهر</th><th>إيراد</th><th>الحصة</th><th>باقي الحصة</th><th>التزامات وطوارئ</th><th>توزيع</th><th>الرصيد</th></tr></thead><tbody>
    <tr><td class="muted">البداية</td><td></td><td></td><td></td><td></td><td></td><td class="num">${fmt(S.opening)}</td></tr>${rows}</tbody></table></div></details></section>`;
  return h;
}

  h+=`<section class="card"><h2>حدود الاحتياطي (بالشهور)</h2><div class="fields two">

    </div><p class="hint" id="tHint">${tHint()}</p></section>`;
  h+=`<section class="card"><h2>توزيع الفايض (٪)</h2><div class="fields">
      ${BUCKETS.map(([k,n])=>`<div class="field"><label for="s-${k}">${n}</label><input class="num" id="s-${k}" data-set="split" data-key="${k}" type="number" inputmode="numeric" min="0" max="100" step="5" value="${set.split[k]}"></div>`).join('')}
    </div><p class="hint" id="splitHint">${splitHint()}</p></section>`;
  h+=`<section class="card"><h2>أفراد الحساب</h2><div class="fields two">
      <div class="field"><label for="m-0">الأول</label><input id="m-0" data-set="member" data-key="0" type="text" value="${esc(set.members[0])}"></div>
      <div class="field"><label for="m-1">الثاني</label><input id="m-1" data-set="member" data-key="1" type="text" value="${esc(set.members[1])}"></div>
